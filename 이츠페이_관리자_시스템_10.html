async function refreshTalkPostsFromServer(){
  const params=new URLSearchParams();
  params.set('status',talkFilters.status||'ACTIVE');
  params.set('q',talkFilters.q||'');
  params.set('page',String(Math.max(Number(talkPagination.page||1),1)));
  params.set('limit',String(Number(talkPagination.pageSize||10)));
  const res=await fetch(`/api/admin/talk/posts?${params.toString()}`,{headers:adminAuthHeaders(),cache:'no-store'});
  const json=await res.json().catch(()=>({}));
  if(await handleAdminUnauthorized(res))return refreshTalkPostsFromServer();
  if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'이츠톡 목록을 불러오지 못했습니다.');
  D.talkPosts=Array.isArray(json.data)?json.data:[];
  const meta=json.meta||{};
  talkPagination={
    page:Number(meta.page||talkPagination.page||1),
    pageSize:Number(meta.pageSize||talkPagination.pageSize||10),
    total:Number(meta.total||0),
    totalPages:Math.max(Number(meta.totalPages||1),1)
  };
}

async function savAdm(id){
  const loginId=v('adi').trim();
  const n=v('adn').trim();
  const p=adminPasswordValue('adp'),p2=adminPasswordValue('adp2');
  if(!loginId||!n){await adminAlert('로그인 아이디와 이름을 입력하세요.');return;}
  if(!id&&!p){await adminAlert('비밀번호를 입력하세요.');return;}
  if(p&&p.length<8){await adminAlert('관리자 비밀번호는 8자 이상으로 입력해주세요.');return;}
  if((p||p2)&&p!==p2){await adminAlert('비밀번호 불일치');return;}
  const adminPermissions=collectAdminPermissions();
  if(!adminPermissions.length){await adminAlert('접근 가능한 메뉴를 1개 이상 선택하세요.');return;}
  try{
    const body={loginId,name:n,adminLevel:v('adr'),adminPermissions};
    if(p)body.password=p;
    const res=await fetch(id?`/api/admin/admins/${encodeURIComponent(id)}`:'/api/admin/admins',{method:id?'PATCH':'POST',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    const json=await res.json().catch(()=>({}));
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'관리자 계정 저장에 실패했습니다.');
    closeM();await syncBackendTransactions({forceRender:true});toast(id?'관리자 계정이 수정되었습니다.':'관리자 계정이 생성되었습니다.');
  }catch(e){await adminAlert(e.message||'관리자 계정 저장에 실패했습니다.');}
}

const INSTALLMENT_MIN_YEAR=2026;
const INSTALLMENT_MIN_MONTH=6;
const INSTALLMENT_MONTHS=[2,3,4,5,6];
const DEFAULT_CARD_COMPANIES=['신한카드','삼성카드','현대카드','KB국민카드','롯데카드','우리카드','하나카드','BC카드','NH농협카드','IBK기업카드','씨티카드','수협카드','전북카드','광주카드','제주카드','DGB대구은행카드','BNK부산카드','BNK경남카드','MG새마을금고카드','신협카드','카카오뱅크카드','케이뱅크카드','토스뱅크카드'];
function installmentRows(){
  if(Array.isArray(D.installments)){
    return D.installments.map((item,i)=>({
      cardCompany:item.cardCompany,
      months:Array.isArray(item.months)?item.months.map(Number):[],
      partialPlans:Array.isArray(item.partialPlans)?item.partialPlans:[],
      active:item.active!==false,
      displayOrder:item.displayOrder||i+1
    }));
  }
  if(D.installments&&typeof D.installments==='object'){
    return Object.entries(D.installments).map(([card,data],i)=>({
      cardCompany:card,
      months:Array.isArray(data.months)?data.months.map(Number):Array.isArray(data.curr)?data.curr.map(Number):[],
      partialPlans:Array.isArray(data.partialPlans)?data.partialPlans:[],
      active:data.active!==false,
      displayOrder:data.displayOrder||i+1
    }));
  }
  return [];
}
function parseInstallmentPartialPlans(value){
  return String(value||'').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
    const months=[...new Set((line.match(/\d+\s*개월/g)||[]).map(match=>Number(match.replace(/[^\d]/g,''))).filter(month=>month>=2&&month<=6))].sort((a,b)=>a-b);
    return{label:line,months};
  }).filter(item=>item.label&&(!/\d+\s*개월/.test(item.label)||item.months.length)).slice(0,20);
}

function currentKstInstallmentCursor(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit'}).formatToParts(new Date());
  let year=Number(parts.find(part=>part.type==='year')?.value)||INSTALLMENT_MIN_YEAR;
  let month=Number(parts.find(part=>part.type==='month')?.value)||INSTALLMENT_MIN_MONTH;
  if(year<INSTALLMENT_MIN_YEAR||(year===INSTALLMENT_MIN_YEAR&&month<INSTALLMENT_MIN_MONTH)){
    year=INSTALLMENT_MIN_YEAR;
    month=INSTALLMENT_MIN_MONTH;
  }
  return{year,month};
}
function normalizeInstallmentCursor(){
  if(!window._instYear||!window._instMonth){
    const current=currentKstInstallmentCursor();
    window._instYear=current.year;
    window._instMonth=current.month;
  }
  if(window._instYear<INSTALLMENT_MIN_YEAR||(window._instYear===INSTALLMENT_MIN_YEAR&&window._instMonth<INSTALLMENT_MIN_MONTH)){
    window._instYear=INSTALLMENT_MIN_YEAR;
    window._instMonth=INSTALLMENT_MIN_MONTH;
  }
}
function installmentPolicyMonth(){
  normalizeInstallmentCursor();
  return `${window._instYear}-${String(window._instMonth).padStart(2,'0')}-01`;
}
function installmentPolicyLabel(year,month){
  return `${year}년 ${month}월`;
}
function previousInstallmentPolicyCursor(){
  normalizeInstallmentCursor();
  let y=window._instYear;
  let m=window._instMonth-1;
  if(m<1){m=12;y-=1;}
  return{year:y,month:m};
}
async function loadInstallmentsForCursor(options={}){
  const shouldRender=options.render!==false;
  try{
    const res=await fetch(`/api/admin/installments?policyMonth=${encodeURIComponent(installmentPolicyMonth())}`,{headers:adminAuthHeaders(),cache:'no-store'});
    if(await handleAdminUnauthorized(res))return;
    if(!res.ok)throw new Error('무이자 할부 설정을 불러오지 못했습니다.');
    const json=await res.json();
    D.installments=Array.isArray(json.data)?json.data:[];
    D.installmentPolicyMeta=json.meta&&typeof json.meta==='object'?json.meta:{generalNote:'',exclusionNotes:[]};
    save();
    if(shouldRender)renderPage();
  }catch(e){
    console.error(e);
    D.installments=[];
    save();
    if(shouldRender)renderPage();
    toast(e.message||'무이자 할부 설정 조회 실패');
  }
}
async function moveInstallmentMonth(delta){
  normalizeInstallmentCursor();
  let y=window._instYear;
  let m=window._instMonth+delta;
  if(m<1){m=12;y-=1;}
  if(m>12){m=1;y+=1;}
  if(y<INSTALLMENT_MIN_YEAR||(y===INSTALLMENT_MIN_YEAR&&m<INSTALLMENT_MIN_MONTH)){
    toast('2026년 6월 이전 데이터는 이동할 수 없습니다.');
    y=INSTALLMENT_MIN_YEAR;
    m=INSTALLMENT_MIN_MONTH;
  }
  window._instYear=y;
  window._instMonth=m;
  D.installments=[];
  await loadInstallmentsForCursor();
}
const installmentCtx=()=>{
  normalizeInstallmentCursor();
  const yr=window._instYear;
  const mo=window._instMonth;
  const rows=installmentRows();
  const rowMap=new Map(rows.map(row=>[row.cardCompany,row]));
  const cards=DEFAULT_CARD_COMPANIES.map((card,i)=>rowMap.get(card)||{cardCompany:card,months:[],active:false,displayOrder:i+1});
  const isMinMonth=yr===INSTALLMENT_MIN_YEAR&&mo===INSTALLMENT_MIN_MONTH;
  const label=`${yr}년 ${mo}월`;
  const meta=D.installmentPolicyMeta&&typeof D.installmentPolicyMeta==='object'?D.installmentPolicyMeta:{generalNote:'',exclusionNotes:[]};
  return{yr,mo,cards,months:INSTALLMENT_MONTHS,isMinMonth,label,meta,esc};
};

async function savInst(){
  const cardMap=new Map();
  document.querySelectorAll('.ci-month').forEach(el=>{
    const card=el.dataset.card;
    if(!cardMap.has(card))cardMap.set(card,{cardCompany:card,months:[],active:false,displayOrder:Number(el.dataset.order||0)});
    if(el.checked)cardMap.get(card).months.push(Number(el.value));
  });
  document.querySelectorAll('.ci-partial').forEach(el=>{
    const card=el.dataset.card;
    if(!cardMap.has(card))cardMap.set(card,{cardCompany:card,months:[],partialPlans:[],active:false,displayOrder:Number(el.dataset.order||0)});
    cardMap.get(card).partialPlans=parseInstallmentPartialPlans(el.value);
  });
  const items=[...cardMap.values()].map(item=>({
    ...item,
    months:[...new Set(item.months||[])].sort((a,b)=>a-b),
    partialPlans:Array.isArray(item.partialPlans)?item.partialPlans:[],
    active:(item.months||[]).length>0||(item.partialPlans||[]).length>0
  }));

async function sendPushBroadcast(){

async function uploadDesignSetReferenceImageFile(file,source='업로드'){
  const form=new FormData();
  form.append('file',file);
  const button=document.querySelector('[data-admin-action="design-set-upload-reference"]');
  const pasteZone=document.getElementById('ds-ref-paste-zone');
  const pasteStatus=document.getElementById('ds-ref-paste-status');
  const prevText=button?.textContent||'참고 이미지 업로드';
  if(button){button.disabled=true;button.textContent=source==='붙여넣기'?'붙여넣는 중':'업로드 중';}
  if(pasteZone)pasteZone.classList.add('is-uploading');
  try{
    const res=await fetch('/api/admin/design-sets/upload-reference-image',{method:'POST',headers:adminAuthHeaders(),body:form});
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res))return;
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'참고 이미지 업로드에 실패했습니다.');
    const input=document.getElementById('ds-ref');

    if(pasteStatus)pasteStatus.textContent=`${source}한 참고 이미지가 URL에 반영되었습니다.`;
    toast(`참고 이미지 ${source}`);
  }catch(e){await adminAlert(e.message||'참고 이미지 업로드에 실패했습니다.');}
  finally{if(button){button.disabled=false;button.textContent=prevText;}if(pasteZone)pasteZone.classList.remove('is-uploading');}

async function saveDesignSet(id){
  let data;
  try{
    data=readDesignSetForm();
  }catch(e){
    await adminAlert(e.message||'디자인시스템 입력값을 확인하세요.');
    return;
  }
  if(!data.name){await adminAlert('디자인시스템 이름은 필수입니다.');return;}
  try{
    const isNew=!id||id==='new';
    const res=await fetch(isNew?'/api/admin/design-sets':`/api/admin/design-sets/${encodeURIComponent(id)}`,{method:isNew?'POST':'PATCH',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(data)});
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res))return;
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'디자인시스템 저장에 실패했습니다.');
    if(isNew)D.designSets.push(json.data);
    else{
      const idx=D.designSets.findIndex(x=>String(x.id)===String(id));
      if(idx>=0)D.designSets[idx]=json.data;

async function deleteDesignSet(id){

async function saveBannerOrder(items){
  const ids=items.map(item=>Number(item.id)).filter(Number.isFinite);
  if(!ids.length)return;
  items.forEach((item,index)=>{item.displayOrder=index+1;item.order=index+1;});
  renderPage();
  try{
    const res=await fetch('/api/admin/banners/order',{method:'PATCH',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({ids})});
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res))return;
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'배너 순서 저장에 실패했습니다.');
    const updated=Array.isArray(json.data)?json.data:[];
    updated.forEach(item=>{
      const idx=D.banners.findIndex(x=>String(x.id)===String(item.id));
      if(idx>=0)D.banners[idx]=item;
    });
    renderPage();
    toast('배너 순서 저장');
  }catch(e){
    await adminAlert(e.message||'배너 순서 저장에 실패했습니다.');
    await syncBackendTransactions({forceRender:true});
  }
}
async function moveBn(id,direction){
  const items=orderedBannersForCurrentTab();
  const idx=items.findIndex(item=>String(item.id)===String(id));
  const next=idx+Number(direction||0);
  if(idx<0||next<0||next>=items.length)return;
  const tmp=items[idx];
  items[idx]=items[next];
  items[next]=tmp;
  await saveBannerOrder(items);
}

function normalizePopupInlineColor(color){
  const value=String(color||'').trim();
  const hex=value.match(/^#?([0-9a-f]{6})$/i);
  if(hex)return `#${hex[1].toUpperCase()}`;
  const rgb=value.match(/^rgba?\(\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})(?:[\s,/]+[\d.]+)?\s*\)$/i);
  if(rgb){
    const parts=rgb.slice(1,4).map(n=>Math.max(0,Math.min(255,Number(n)||0)).toString(16).padStart(2,'0').toUpperCase());
    return `#${parts.join('')}`;
  }
  return '';
}
function sanitizePopupInlineHtml(html){
  const box=document.createElement('div');
  box.innerHTML=String(html||'');
  const out=document.createElement('div');
  const blockTags=new Set(['div','p','li']);
  const walk=(node,parent)=>{
    if(node.nodeType===Node.TEXT_NODE){parent.appendChild(document.createTextNode(node.textContent||''));return;}
    if(node.nodeType!==Node.ELEMENT_NODE)return;
    const tag=node.tagName.toLowerCase();
    if(tag==='br'){parent.appendChild(document.createElement('br'));return;}
    const color=String(node.getAttribute('color')||node.style?.color||'').trim();
    const span=document.createElement('span');
    const safeColor=normalizePopupInlineColor(color);
    if(safeColor)span.style.color=safeColor;
    Array.from(node.childNodes).forEach(child=>walk(child,span));
    if(span.style.color||span.childNodes.length)parent.appendChild(span);
    if(blockTags.has(tag))parent.appendChild(document.createElement('br'));
  };
  Array.from(box.childNodes).forEach(node=>walk(node,out));
  return out.innerHTML.replace(/(<br>)+$/i,'');
}

function applyPopupTextColor(color){
  const selection=window.getSelection?.();
  const active=document.activeElement?.closest?.('[data-popup-rich]');
  if(!selection||!active||selection.rangeCount===0)return;
  document.execCommand('foreColor',false,color);
  syncPopupRichEditors();
  active.dispatchEvent(new Event('input',{bubbles:true}));
}
function insertPopupRichLineBreak(editor){
  const selection=window.getSelection?.();
  if(!selection||selection.rangeCount===0)return;
  const range=selection.getRangeAt(0);
  if(!editor.contains(range.commonAncestorContainer))return;
  range.deleteContents();
  const br=document.createElement('br');
  range.insertNode(br);
  range.setStartAfter(br);
  range.setEndAfter(br);
  selection.removeAllRanges();
  selection.addRange(range);
  syncPopupRichEditors();
  editor.dispatchEvent(new Event('input',{bubbles:true}));
}

function bindPopupEditorTabs(initialTab='copy'){
  const root=document.querySelector('.popup-editor');
  if(!root)return;
  const tabs=Array.from(root.querySelectorAll('[data-popup-editor-tab]'));
  const panels=Array.from(root.querySelectorAll('[data-popup-editor-panel]'));
  if(!tabs.length||!panels.length)return;
  const activate=(requested,focus=false)=>{
    const key=tabs.some(tab=>tab.dataset.popupEditorTab===requested)?requested:'copy';
    tabs.forEach(tab=>{
      const active=tab.dataset.popupEditorTab===key;
      tab.classList.toggle('is-active',active);
      tab.setAttribute('aria-selected',active?'true':'false');
      tab.tabIndex=active?0:-1;
      if(active&&focus)tab.focus();
    });
    panels.forEach(panel=>panel.classList.toggle('is-active',panel.dataset.popupEditorPanel===key));
  };
  tabs.forEach((tab,index)=>{
    tab.addEventListener('click',()=>activate(tab.dataset.popupEditorTab));
    tab.addEventListener('keydown',event=>{
      if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;
      event.preventDefault();
      const step=event.key==='ArrowRight'?1:-1;
      const next=(index+step+tabs.length)%tabs.length;
      activate(tabs[next].dataset.popupEditorTab,true);
    });
  });
  activate(initialTab);
}

  if(logo)form.append('logo',logo);

  form.append('style',v('bnstyle')||'premium');
  form.append('layout',v('bntp')==='팝업'?'popup':'banner');
  form.append('placement',v('bntp')||'메인');
  if(v('bntp')==='팝업')form.append('popupTemplateJson',popupTemplateJson());
  const designSet=(D.designSets||[]).find(item=>String(item.id)===String(v('bn-design-set')));
  if(designSet){
    form.append('designSetId',designSet.id);
    form.append('designSetName',designSet.name||'');
    form.append('tone',designSet.tone||'');
    form.append('colors',Array.isArray(designSet.colors)?designSet.colors.join(','):'');

  const button=document.querySelector('[data-admin-action="banner-generate-image"]');
  const prevText=button?.textContent||'배너 이미지 생성';
  if(button){button.disabled=true;button.textContent='생성 중';}
  try{
    const res=await fetch('/api/admin/banners/render-image',{method:'POST',headers:adminAuthHeaders(),body:form});
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res))return;
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'배너 이미지 생성에 실패했습니다.');
    const imageUrl=json.data?.imageUrl||'';
    const input=document.getElementById('bni');
    const preview=document.getElementById('bn-generated-preview');
    const wrap=preview?.closest('.banner-generated-preview-wrap');

    if(wrap)wrap.classList.remove('is-empty');

    toast('배너 이미지 생성');
  }catch(e){await adminAlert(e.message||'배너 이미지 생성에 실패했습니다.');}

}

function clipboardImageFile(event,prefix='image'){
  const items=Array.from(event?.clipboardData?.items||[]);
  const item=items.find(entry=>entry.kind==='file'&&/^image\//i.test(entry.type||''));
  const file=item?.getAsFile?.()||null;
  if(!file)return null;
  const ext=(file.type||'image/png').split('/')[1]?.replace('jpeg','jpg')||'png';
  return new File([file],`${prefix}-${Date.now()}.${ext}`,{type:file.type||'image/png'});
}

function homepageTrafficSourceName(value){

function homepageTrafficMediumLabel(value){

function fmtAnalyticsPct(value){return `${Number(value||0).toLocaleString('ko-KR',{maximumFractionDigits:1})}%`;}
function fmtAnalyticsTime(value){
  if(!value)return'-';
  const d=new Date(value);

function homepageAnalyticsEmptyRow(label='아직 수집된 데이터가 없습니다.',cols=3){

function homepageAnalyticsTabButton(key,label){
  return `<button type="button" class="btn sm ${homepageAnalyticsTab===key?'bg2':'bo'}" data-admin-action="homepage-analytics-tab" data-homepage-analytics-tab="${esc(key)}">${esc(label)}</button>`;
}
function homepageAnalyticsPageState(key,rows=[]){
  const total=Array.isArray(rows)?rows.length:0;
  const totalPages=Math.max(1,Math.ceil(total/HOMEPAGE_ANALYTICS_PAGE_SIZE));
  const current=Math.min(Math.max(1,Number(homepageAnalyticsPages[key]||1)),totalPages);
  homepageAnalyticsPages[key]=current;
  const start=(current-1)*HOMEPAGE_ANALYTICS_PAGE_SIZE;
  return {current,total,totalPages,start,end:Math.min(start+HOMEPAGE_ANALYTICS_PAGE_SIZE,total),rows:rows.slice(start,start+HOMEPAGE_ANALYTICS_PAGE_SIZE)};
}
function homepageAnalyticsPager(key,rows=[]){
  const state=homepageAnalyticsPageState(key,rows);
  if(state.total<=HOMEPAGE_ANALYTICS_PAGE_SIZE)return state.total?`<div class="admin-analytics-pager admin-analytics-pager-single">${state.total}개 표시</div>`:'';
  return `<div class="admin-analytics-pager">
    <span>${fmtAnalyticsNum(state.start+1)}-${fmtAnalyticsNum(state.end)} / ${fmtAnalyticsNum(state.total)}</span>
    <div class="admin-analytics-pager-buttons">
      <button type="button" class="btn xs bo" data-admin-action="homepage-analytics-page" data-homepage-analytics-page-key="${esc(key)}" data-homepage-analytics-page="${state.current-1}" ${state.current<=1?'disabled':''}>이전</button>

      <button type="button" class="btn xs bo" data-admin-action="homepage-analytics-page" data-homepage-analytics-page-key="${esc(key)}" data-homepage-analytics-page="${state.current+1}" ${state.current>=state.totalPages?'disabled':''}>다음</button>
    </div>
  </div>`;
}
async function loadHomepageAnalyticsReport(force=false){
  if(homepageAnalyticsLoading)return;
  const loadedAt=Number(D.homepageAnalytics?.loadedAt||0);
  if(!force&&loadedAt&&Date.now()-loadedAt<60000)return;
  try{
    if(!await ensureAdminLogin())return;
    homepageAnalyticsLoading=true;
    const res=await fetch('/api/admin/homepage-analytics?days=30',{headers:adminAuthHeaders(),cache:'no-store'});
    if(await handleAdminUnauthorized(res))return loadHomepageAnalyticsReport(true);
    if(!res.ok)throw new Error('홈페이지 분석 데이터를 불러오지 못했습니다.');
    const json=await res.json();
    D.homepageAnalytics={...(json.data||{}),loadedAt:Date.now()};
    homepageAnalyticsLoading=false;
    if(page==='homepageAnalytics')renderPage();
  }catch(e){
    D.homepageAnalytics={error:e.message||'홈페이지 분석 데이터를 불러오지 못했습니다.',loadedAt:Date.now()};

  }finally{
    homepageAnalyticsLoading=false;
  }
}

function auditCategoryLabel(category){
  return AUDIT_NOTIFICATION_CATEGORIES.find(item=>item.key===category)?.label||category||'기타';
}
function auditLogCategory(log={}){
  const entity=String(log.entityType||'').toLowerCase();
  const action=String(log.action||'').toUpperCase();
  if(entity.includes('banner')||action.includes('BANNER'))return'banners';
  if(entity.includes('account')||action.includes('ACCOUNT'))return'accounts';
  if(entity.includes('inquiry')||action.includes('INQUIRY'))return'inquiries';
  if(entity.includes('franchise')||action.includes('FRANCHISE'))return'franchises';
  if(entity.includes('agency')||action.includes('AGENCY'))return'agencies';
  if(entity.includes('talk')||action.includes('TALK'))return'talk';
  if(entity.includes('notice')||entity.includes('guide')||entity.includes('faq')||action.includes('NOTICE')||action.includes('GUIDE')||action.includes('FAQ'))return'boards';
  if(entity.includes('installment')||action.includes('INSTALLMENT'))return'installments';
  if(entity.includes('admin')||action.includes('ADMIN_USER')||action.includes('ADMIN_PASSWORD'))return'admins';
  if(entity.includes('pg')||action.includes('PG_'))return'pg';
  return'system';
}
function auditLogActorPrimary(log={}){
  return String(log.actorName||log.actorLoginId||'웹 접수').trim();
}
function auditLogActorSecondary(log={}){
  const primary=auditLogActorPrimary(log);
  const login=String(log.actorLoginId||'').trim();
  if(login&&login!==primary)return login;
  return String(log.actorRole||'').trim()||'-';
}
function formatAuditLogTime(value){
  if(!value)return'-';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value||'').replace('T',' ').slice(0,16)||'-';
  const parts=new Intl.DateTimeFormat('sv-SE',{
    timeZone:'Asia/Seoul',
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  }).formatToParts(d).reduce((acc,part)=>{acc[part.type]=part.value;return acc;},{});
  return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
}
function auditFieldLabel(field){

    phone:'연락처',
    inquiryType:'문의 유형',
    deliveryAgency:'배달대행사',

function auditValueText(value){
  if(value===undefined||value===null||value==='')return '없음';
  if(typeof value==='boolean')return value?'예':'아니오';
  if(Array.isArray(value))return value.length?value.join(', '):'없음';
  if(typeof value==='object')return JSON.stringify(value);
  const text=String(value);
  const talkStatusLabels={SALE:'판매중',RESERVED:'예약중',SOLD:'판매완료',ACTIVE:'노출',DELETED:'삭제'};
  return talkStatusLabels[text]||text;
}
function auditEntityLabel(log={}){
  const category=auditLogCategory(log);
  const labels={inquiries:'문의',banners:'배너',accounts:'출금계좌',franchises:'가맹점',agencies:'대리점',talk:'이츠톡',boards:'게시판',installments:'무이자 할부',admins:'관리자 계정',pg:'PG',system:'운영 설정'};
  return labels[category]||'항목';
}
function auditLogChangeDetails(log={}){
  const fields=Array.isArray(log.changedFields)?log.changedFields.slice(0,4):[];
  const before=log.beforeData||{};
  const after=log.afterData||{};
  if(!fields.length)return '';
  return fields.map(field=>{
    const beforeText=auditValueText(before[field]);
    const afterText=auditValueText(after[field]);
    if(field==='deleted')return '삭제 처리됨';
    if(field==='cancelled')return '취소 처리됨';
    if(field==='status')return `${beforeText}에서 ${afterText}로 상태 변경`;
    if(field==='tradeStatus')return `${beforeText}에서 ${afterText}로 거래상태 변경`;
    return `${auditFieldLabel(field)}: ${beforeText} → ${afterText}`;
  }).join(' / ');
}
function auditLogPrimaryChangeSentence(log={}){
  const fields=Array.isArray(log.changedFields)?log.changedFields:[];
  const before=log.beforeData||{};
  const after=log.afterData||{};
  const target=log.entityName||log.entityId||auditEntityLabel(log);
  if(fields.includes('status')){
    return `${target} 상태를 ${auditValueText(before.status)}에서 ${auditValueText(after.status)}로 변경했습니다.`;
  }
  if(fields.includes('tradeStatus')){
    return `${target} 거래상태를 ${auditValueText(before.tradeStatus)}에서 ${auditValueText(after.tradeStatus)}로 변경했습니다.`;
  }
  if(fields.includes('deleted'))return `${target} 항목을 삭제했습니다.`;
  if(fields.includes('cancelled'))return `${target} 신청을 취소했습니다.`;
  if(String(log.action||'').includes('CREATE'))return `${target} 항목을 새로 등록했습니다.`;
  if(fields.length){
    return `${target} 항목의 ${fields.slice(0,3).map(auditFieldLabel).join(', ')}을 변경했습니다.`;
  }
  return `${target} 항목을 변경했습니다.`;
}
function auditLogSummary(log={}){
  const actor=auditLogActorPrimary(log);

}
function isOwnAuditLog(log={}){
  const currentId=String(currentAdmin?.id||'').trim();
  const actorId=String(log.actorUserId||log.actor_user_id||'').trim();
  if(currentId&&actorId&&currentId===actorId)return true;
  const currentLogin=String(currentAdmin?.loginId||currentAdmin?.email||'').trim().toLowerCase();
  const actorLogin=String(log.actorLoginId||log.actor_login_id||'').trim().toLowerCase();
  return !!currentLogin&&!!actorLogin&&currentLogin===actorLogin;
}
function playAdminAuditSound(){
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)return;
    const ctx=new AudioContext();
    const playTone=(frequency,start,duration,peak=0.07)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='triangle';
      osc.frequency.value=frequency;
      gain.gain.setValueAtTime(0.001,ctx.currentTime+start);
      gain.gain.exponentialRampToValueAtTime(peak,ctx.currentTime+start+0.025);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime+start);
      osc.stop(ctx.currentTime+start+duration+0.02);
    };
    playTone(660,0,0.16,0.055);
    playTone(990,0.13,0.22,0.075);
    setTimeout(()=>{try{ctx.close();}catch(_){}},520);
  }catch(_){}
}
function notifyNewAuditLogs(nextLogs=[]){
  const rows=Array.isArray(nextLogs)?nextLogs:[];
  const latestId=rows[0]?.id?String(rows[0].id):'';
  if(!latestId)return;
  if(auditLogLatestSeenId===null){auditLogLatestSeenId=latestId;return;}
  if(latestId===auditLogLatestSeenId)return;
  const prevIndex=rows.findIndex(log=>String(log.id)===String(auditLogLatestSeenId));
  const lastSeenNumber=Number(auditLogLatestSeenId);
  const newRows=(prevIndex>=0
    ? rows.slice(0,prevIndex)
    : rows.filter(log=>{
        const idNumber=Number(log.id);
        return Number.isFinite(idNumber)&&Number.isFinite(lastSeenNumber)?idNumber>lastSeenNumber:String(log.id)!==auditLogLatestSeenId;
      }))
    .filter(log=>!isOwnAuditLog(log)&&auditPreferenceEnabled(auditLogCategory(log)));
  auditLogLatestSeenId=latestId;
  if(!newRows.length)return;
  const first=newRows[0];
  const summary=auditLogSummary(first);
  toast(newRows.length>1?`새 변경기록 ${newRows.length}건 · ${summary}`:summary);
  playAdminAuditSound();
}
function pgNotificationValue(item,...keys){
  const sources=[item,item?.payload,item?.payload?.result,item?.payload?.pay,item?.payload?.billing,item?.payload?.rebill,item?.query];
  for(const source of sources){
    if(!source||typeof source!=='object')continue;
    for(const key of keys){
      const value=source[key];
      if(value!==undefined&&value!==null&&String(value).trim()!=='')return String(value).trim();
    }
  }
  return '';
}
function compactAdminValue(value){
  return String(value||'').trim();
}
function notificationAmountText(value){
  const amount=Number(String(value||'').replace(/[^0-9.-]/g,''));
  return Number.isFinite(amount)&&amount!==0?fmt(amount):'';
}
function findPaymentByNotiCode(code){
  const key=compactAdminValue(code);
  if(!key)return null;
  return (D.payments||[]).find(payment=>
    [payment.approvalNo,payment.id,payment.transactionId,payment.pgTxId,payment.pgTransactionId]
      .some(value=>compactAdminValue(value)===key)
  )||null;
}
function findSettlementByNotiCode(code){
  const key=compactAdminValue(code);
  if(!key)return null;
  return (D.pgSettlements||[]).find(row=>
    [row.approvalNo,row.pgTxId,row.pgTransactionId,row.depositCode,row.depositTxid,row.txid]
      .some(value=>compactAdminValue(value)===key)
  )||null;
}
function notificationFranchiseName(row){

}
function formatPgNotificationSummary(item={}){
  const transferResult=pgNotificationValue(item,'transResult');
  const transferSeq=pgNotificationValue(item,'transSeq');
  if(transferResult||transferSeq){
    const bank=pgNotificationValue(item,'bankNm','bankName','bank');
    const account=pgNotificationValue(item,'acctNo','accountNo','account_no');
    const holder=pgNotificationValue(item,'acctNm','accountHolder','holder');
    const amount=pgNotificationValue(item,'transAmt','amount','payAmt');
    const settlement=findSettlementByNotiCode(transferSeq);
    const franchise=notificationFranchiseName(settlement);
    const amountText=notificationAmountText(amount)||notificationAmountText(settlement?.netAmt||settlement?.paymentAmt);
    const accountText=[bank,account].filter(Boolean).join(' ');
    return `입금 ${transferResult||'POST'}${franchise?` 가맹점=${franchise}`:''}${holder?` 예금주=${holder}`:''}${accountText?` 계좌=${accountText}`:''}${amountText?` 금액=${amountText}`:''}`;
  }
  const tx=pgNotificationValue(item,'transactionId','transaction_id','trackId','track_id','approvalNo','approval_no','orderId','moid');
  const pgTx=pgNotificationValue(item,'pgTransactionId','pg_transaction_id','trxId','tid','TID','txId');
  const code=pgNotificationValue(item,'resultCode','resultCd','result_code','code');
  const event=pgNotificationValue(item,'eventType','event_type','status','payStatus','type')||item.eventType||'NOTI';
  const payment=findPaymentByNotiCode(tx)||findPaymentByNotiCode(pgTx);
  const settlement=findSettlementByNotiCode(tx)||findSettlementByNotiCode(pgTx);

  const amount=notificationAmountText(payment?.amount||settlement?.paymentAmt||pgNotificationValue(item,'amount','payAmt','totalAmount'));
  return `${event}${franchise?` 가맹점=${franchise}`:''}${amount?` 결제금액=${amount}`:''}${tx?` 결제코드=${tx}`:''}${pgTx?` 입금코드=${pgTx}`:''}${code?` 결과=${code}`:''}`;
}
function formatPgNotificationDetail(item={}){
  const transferSeq=pgNotificationValue(item,'transSeq');

  const comp=pgNotificationValue(item,'compNm','compId');

function avicxPendingLabel(command){
  const text=String(command||'').trim().toLowerCase();
  if(text.startsWith('codex apply'))return 'Codex 제안 준비 중';
  if(text.startsWith('codex '))return 'Codex 연결/분석 중';
  if(text.startsWith('db '))return 'DB 조회 중';
  if(text.startsWith('noti ')||text.startsWith('deposit '))return '노티 조회 중';
  return '명령 실행 중';
}
function avicxAppendPending(command){
  const started=Date.now();
  const label=avicxPendingLabel(command);
  const row=avicxAppend('pending', `<span class="avicx-spinner" aria-hidden="true"></span><span>${esc(label)}</span><span class="avicx-pending-time">0초</span>`);
  if(!row)return {done(){}};
  const tick=()=>{
    const seconds=Math.max(0,Math.round((Date.now()-started)/1000));
    const time=row.querySelector('.avicx-pending-time');
    if(time)time.textContent=`${seconds}초`;
  };
  const timer=setInterval(tick,1000);
  tick();
  return {
    done(kind='success',message='완료'){
      clearInterval(timer);
      row.classList.remove('pending');
      row.classList.add(kind==='error'?'error':(kind==='warn'?'warn':'muted'));
      const seconds=Math.max(0,Math.round((Date.now()-started)/1000));
      row.innerHTML=`${esc(message)} · ${seconds}초`;
    }
  };
}
function avicxEmptyStateHtml(message='ready'){

}
function avicxResetOutput(message='ready'){
  if(message==='cleared')avicxSetFocusMode(false);
  const out=avicxOutputEl();
  if(!out)return;
  out.innerHTML=avicxEmptyStateHtml(message);
  out.scrollTop=0;
}

function avicxCommandCatalog(){
  const providers=(D.pgProviders||[]).map(provider=>String(provider.name||'').trim()).filter(Boolean);
  const providerCommands=providers.flatMap(name=>[`noti provider ${name}`,`pg ${name}`]);
  return [
    'help','clear','health','status','brief','today brief','history','session new','session restore',
    'pg list','pg status','pg gh','pg routeup',
    'noti latest','noti latest 50','noti provider 위루트','noti provider GH Payments',
    'deposit latest','deposit latest 50','settle pending','settle pending 50','sales today','sales yesterday','sales 2026-07-01',
    'franchise search ','franchise payments ','franchise payments 슬건01','account pending','card list ',
    'db tables','db describe pg_providers','db describe pg_notifications','db describe transactions',
    'db select pg_providers limit 20','db select pg_notifications limit 20','db select transactions limit 20',
    'explain ','codex exec ','codex apply ','codex ask ','codex adk ',
    ...providerCommands
  ].filter((value,index,array)=>value&&array.indexOf(value)===index);
}
function avicxCompletionBox(){return document.getElementById('avicx-completions');}
function avicxVisibleCompletionButtons(){
  const box=avicxCompletionBox();
  if(!box||box.hidden)return [];
  return Array.from(box.querySelectorAll('[data-avicx-completion]'));
}
function avicxHasVisibleCompletions(){
  return avicxVisibleCompletionButtons().length>0;
}
function avicxMoveCompletion(delta=1){
  const buttons=avicxVisibleCompletionButtons();
  if(!buttons.length)return;
  let index=buttons.findIndex(button=>button.classList.contains('is-active'));
  index=(index+delta+buttons.length)%buttons.length;
  buttons.forEach((button,i)=>button.classList.toggle('is-active',i===index));
  avicxAutocompleteState={prefix:document.getElementById('avicx-command-input')?.value||'',matches:buttons.map(button=>button.dataset.avicxCompletion||''),index};
}
function avicxAcceptCompletion(input){
  const buttons=avicxVisibleCompletionButtons();
  const active=buttons.find(button=>button.classList.contains('is-active'))||buttons[0];
  const selected=active?.dataset?.avicxCompletion||avicxAutocompleteState.matches[avicxAutocompleteState.index]||'';
  if(!selected)return false;
  const current=String(input.value||'');
  if(current===selected)return false;
  input.value=selected;
  input.focus();
  avicxHideCompletions();
  return true;
}
function avicxCommonPrefix(values){
  if(!values.length)return '';
  let prefix=values[0];
  for(const value of values.slice(1)){
    let i=0;
    while(i<prefix.length&&i<value.length&&prefix[i].toLowerCase()===value[i].toLowerCase())i++;
    prefix=prefix.slice(0,i);
  }
  return prefix;
}
function avicxCompletionMatches(prefix){
  const raw=String(prefix||'');
  const q=raw.toLowerCase();
  return avicxCommandCatalog().filter(command=>command.toLowerCase().startsWith(q)).slice(0,12);
}
function avicxRenderCompletions(matches=[],activeIndex=0){
  const box=avicxCompletionBox();
  if(!box)return;
  if(!matches.length){box.hidden=true;box.innerHTML='';return;}
  box.hidden=false;
  box.innerHTML=`<div class="avicx-completion-help">Up/Down 선택 / Enter 적용 / 다시 Enter 실행</div>`+matches.map((item,index)=>`<button type="button" class="avicx-completion ${index===activeIndex?'is-active':''}" data-avicx-completion="${esc(item)}">${esc(item)}</button>`).join('');
}
function avicxApplyCompletion(input,reverse=false){
  const prefix=input.value||'';
  let state=avicxAutocompleteState;
  if(state.prefix!==prefix||!state.matches.length){
    const matches=avicxCompletionMatches(prefix);
    if(!matches.length){avicxRenderCompletions([],0);return;}
    const common=avicxCommonPrefix(matches);
    if(common&&common.length>prefix.length){
      input.value=common;
      avicxAutocompleteState={prefix:common,matches,index:0};
      avicxRenderCompletions(matches,0);
      return;
    }
    state={prefix,matches,index:0};
  }else{
    state.index=(state.index+(reverse?-1:1)+state.matches.length)%state.matches.length;
  }
  input.value=state.matches[state.index]||prefix;
  avicxAutocompleteState={prefix:input.value,matches:state.matches,index:state.index};
  avicxRenderCompletions(state.matches,state.index);
}
function avicxHideCompletions(){
  avicxAutocompleteState={prefix:'',matches:[],index:0};
  avicxRenderCompletions([],0);
}
function avicxRenderTable(output){
  const columns=Array.isArray(output?.columns)?output.columns:[];
  const rows=Array.isArray(output?.rows)?output.rows:[];
  if(!rows.length)return '<div class="avicx-line muted">결과가 없습니다.</div>';
  return `<div class="avicx-table-wrap"><table class="avicx-table"><thead><tr>${columns.map(col=>`<th>${esc(col)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(col=>`<td>${esc(row?.[col]??'-')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function avicxRenderOutput(output){
  if(!output)return;
  const out=avicxOutputEl();
  if(!out)return;
  if(output.type==='clear'){avicxResetOutput('cleared');return;}
  if(output.type==='table'){
    const wrap=document.createElement('div');
    wrap.className='avicx-result';
    wrap.innerHTML=avicxRenderTable(output);
    out.appendChild(wrap);out.scrollTop=out.scrollHeight;return;
  }
  if(output.type==='group'){
    (output.sections||[]).forEach(section=>avicxRenderOutput(section));
    return;
  }
  const tone=output.tone||'info';
  (output.lines||[]).forEach(line=>avicxAppend(tone, esc(line)));
}
async function avicxEnsureSession(){
  if(avicxSessionId)return avicxSessionId;
  avicxSessionId=avicxLocalSessionId();
  try{
    const res=await fetch('/api/admin/avicx/session',{method:'POST',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({sessionId:avicxSessionId})});
    const json=await res.json().catch(()=>({}));
    if(res.ok&&json.success&&json.data?.sessionId){avicxSessionId=json.data.sessionId;try{localStorage.setItem('AVICX_SESSION_ID',avicxSessionId);}catch(_){}}
  }catch(e){avicxAppend('error', esc(e.message||'AVICX 세션 연결 실패'));}
  return avicxSessionId;
}
async function avicxLoadHistory(){
  await avicxEnsureSession();
  try{
    const res=await fetch(`/api/admin/avicx/history?sessionId=${encodeURIComponent(avicxSessionId)}&limit=40`,{headers:adminAuthHeaders(),cache:'no-store'});
    const json=await res.json().catch(()=>({}));
    if(!res.ok||!json.success)return;
    const rows=Array.isArray(json.data?.rows)?json.data.rows:[];
    const out=avicxOutputEl();
    if(out)out.innerHTML=avicxEmptyStateHtml('session restored');
    rows.forEach(row=>{avicxAppendCommand(row.command);avicxRenderOutput(row.output);});
  }catch(_){ }
}
async function avicxExecute(command){
  const text=String(command||'').trim();
  if(!text)return;
  const lower=text.toLowerCase();
  if(lower==='session new'){
    avicxSessionId=`avicx_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`;
    try{localStorage.setItem('AVICX_SESSION_ID',avicxSessionId);}catch(_){}
    const out=avicxOutputEl();
    if(out)out.innerHTML='';
    avicxAppendCommand(text);
    await avicxEnsureSession();
    avicxAppend('success', `new session: ${esc(avicxSessionId)}`);
    return;
  }
  if(lower==='session restore'){
    avicxAppendCommand(text);
    await avicxLoadHistory();
    return;
  }
  await avicxEnsureSession();
  avicxHistory.push(text);avicxHistoryIndex=avicxHistory.length;
  if(lower==='clear'){
    try{
      const res=await fetch('/api/admin/avicx/execute',{method:'POST',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({sessionId:avicxSessionId,command:text})});
      const json=await res.json().catch(()=>({}));
      if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'AVICX 명령 실행 실패');
    }catch(_){ }
    avicxResetOutput('cleared');
    return;
  }
  avicxAppendCommand(text);
  const pending=avicxAppendPending(text);
  try{
    const res=await fetch('/api/admin/avicx/execute',{method:'POST',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({sessionId:avicxSessionId,command:text})});
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res)){pending.done('error','로그인이 필요합니다');return;}
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'AVICX 명령 실행 실패');
    pending.done(json.data?.status==='warn'?'warn':'success','응답 수신');
    avicxRenderOutput(json.data?.output);
  }catch(e){pending.done('error','실행 실패');avicxAppend('error', esc(e.message||'AVICX 명령 실행 실패'));}
}

function loadPaymentNotiLayout(){
  if(paymentNotiLayout)return paymentNotiLayout;
  try{
    const saved=JSON.parse(localStorage.getItem(PAYMENT_NOTI_LAYOUT_KEY)||'null');
    if(saved&&typeof saved==='object'){
      if(Number(saved.width||0)<820)saved.width=860;
      if(Number(saved.height||0)<500)saved.height=520;
      paymentNotiLayout=saved;
    }
  }catch(_){paymentNotiLayout=null;}
  return paymentNotiLayout;
}
function savePaymentNotiLayout(){
  try{localStorage.setItem(PAYMENT_NOTI_LAYOUT_KEY,JSON.stringify(paymentNotiLayout||{}));}catch(_){}
}
function clampPaymentNotiLayout(layout={},visibleHeightOverride=null){
  const width=Math.min(Math.max(Number(layout.width)||860,520),Math.max(window.innerWidth-24,520));
  const height=Math.min(Math.max(Number(layout.height)||520,360),Math.max(window.innerHeight-24,360));
  const visibleHeight=Math.min(Math.max(Number(visibleHeightOverride)||height,52),Math.max(window.innerHeight-24,52));
  const left=Math.min(Math.max(Number(layout.left)||Math.max(window.innerWidth-width-24,12),12),Math.max(window.innerWidth-width-12,12));
  const top=Math.min(Math.max(Number(layout.top)||60,12),Math.max(window.innerHeight-visibleHeight-12,12));
  return {left,top,width,height};
}
function applyPaymentNotiLayout(){
  const terminal=document.getElementById('payment-noti-terminal');
  if(!terminal)return;
  const layout=clampPaymentNotiLayout(loadPaymentNotiLayout()||{});
  paymentNotiLayout=layout;
  terminal.style.left=`${layout.left}px`;
  terminal.style.top=`${layout.top}px`;
  terminal.style.width=`${layout.width}px`;
  terminal.style.height=paymentNotiCollapsed?'auto':`${layout.height}px`;
  terminal.style.right='auto';
  terminal.style.bottom='auto';
}
function beginPaymentNotiDrag(ev){
  if(ev.button!==0||ev.target.closest('button'))return;
  const terminal=document.getElementById('payment-noti-terminal');
  if(!terminal)return;
  const rect=terminal.getBoundingClientRect();
  const start={x:ev.clientX,y:ev.clientY,left:rect.left,top:rect.top,width:rect.width,height:rect.height};
  ev.currentTarget.setPointerCapture?.(ev.pointerId);
  const move=moveEv=>{
    paymentNotiLayout=clampPaymentNotiLayout({
      left:start.left+(moveEv.clientX-start.x),
      top:start.top+(moveEv.clientY-start.y),
      width:start.width,
      height:Number(paymentNotiLayout?.height)||start.height
    },paymentNotiCollapsed?start.height:null);
    applyPaymentNotiLayout();
  };
  const done=()=>{savePaymentNotiLayout();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',done);};
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',done,{once:true});
}
function beginPaymentNotiResize(ev){
  if(ev.button!==0)return;
  ev.preventDefault();
  ev.stopPropagation();
  const terminal=document.getElementById('payment-noti-terminal');
  if(!terminal)return;
  const rect=terminal.getBoundingClientRect();
  const start={x:ev.clientX,y:ev.clientY,left:rect.left,top:rect.top,width:rect.width,height:rect.height};
  ev.currentTarget.setPointerCapture?.(ev.pointerId);
  const move=moveEv=>{
    paymentNotiLayout=clampPaymentNotiLayout({
      left:start.left,
      top:start.top,
      width:start.width+(moveEv.clientX-start.x),
      height:start.height+(moveEv.clientY-start.y)
    });
    applyPaymentNotiLayout();
  };
  const done=()=>{savePaymentNotiLayout();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',done);};
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',done,{once:true});
}

function auditLogPageRows(rows){
  const pageSize=Number(auditLogPagination.pageSize||10);
  const total=rows.length;
  const totalPages=Math.max(Math.ceil(total/pageSize),1);
  auditLogPagination.total=total;
  auditLogPagination.totalPages=totalPages;
  auditLogPagination.page=Math.min(Math.max(Number(auditLogPagination.page||1),1),totalPages);
  const start=(auditLogPagination.page-1)*pageSize;
  return rows.slice(start,start+pageSize);
}

    D.guides = Array.isArray(data.guides) ? data.guides : [];
    D.announcements = Array.isArray(data.announcements) ? data.announcements : [];
    D.talkPosts = Array.isArray(data.talkPosts) ? data.talkPosts : [];
    D.admins = Array.isArray(data.admins) ? data.admins : [];
    D.pgProviders = Array.isArray(data.pgProviders) ? data.pgProviders : [];
    D.pgAssignmentRules = Array.isArray(data.pgAssignmentRules) ? data.pgAssignmentRules : [];
    D.inquiries = Array.isArray(data.inquiries) ? data.inquiries : [];
    D.advanceInquiries = Array.isArray(data.advanceInquiries) ? data.advanceInquiries : [];
    D.banners = Array.isArray(data.banners) ? data.banners : [];
    D.designSets = Array.isArray(data.designSets) ? data.designSets : [];
    D.customRoles = Array.isArray(data.customRoles) && data.customRoles.length ? data.customRoles : null;
    D.summary = data.summary && typeof data.summary === 'object' ? data.summary : {};
    D.payments = Array.isArray(data.payments) ? data.payments : [];
    D.pgSettlements = Array.isArray(data.pgSettlements) ? data.pgSettlements : [];
    const nextSnapshot=makeBackendSnapshot();
    const changed=nextSnapshot!==backendSnapshot;
    backendSnapshot=nextSnapshot;
    save();
    if((forceRender||(!auto&&changed))&&!silent){
      render();
    }
    if(page==='payments'&&isSystemAdminLogin()){
      loadPgNotifications({silent:true});

    return changed;
  } catch (e) {
    console.error("Failed to sync backend transactions:", e);
    D.franchises = [];
    D.payments = [];
    D.pgSettlements = [];
    D.summary = {};
    save();
  }
