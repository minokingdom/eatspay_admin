function isCompactAdminMenu(){
  return !!(window.matchMedia&&window.matchMedia('(max-width: 960px)').matches);
}
function isAdminMenuExpanded(){
  return isCompactAdminMenu()?document.body.classList.contains('admin-menu-open'):!document.body.classList.contains('admin-sidebar-collapsed');
}
function setAdminMenuOpen(open,{persist=true}={}){
  const compact=isCompactAdminMenu();
  const next=!!open;
  document.body.classList.toggle('admin-menu-open',compact&&next);
  document.body.classList.toggle('admin-sidebar-collapsed',!compact&&!next);
  const btn=document.getElementById('admin-menu-toggle');
  if(btn){
    btn.setAttribute('aria-expanded',next?'true':'false');
    btn.setAttribute('aria-label',next?'메뉴 접기':'메뉴 펼치기');
    const text=btn.querySelector('.admin-menu-toggle-text');
    const icon=btn.querySelector('.admin-menu-toggle-icon');
    if(text)text.textContent=next?'접기':'펼치기';
    if(icon)icon.textContent=compact?'▾':(next?'‹':'›');
    if(!text)btn.textContent=next?'메뉴 접기':'메뉴 펼치기';
  }
  if(persist){
    try{
      if(compact)sessionStorage.setItem(ADMIN_MENU_OPEN_KEY,next?'1':'0');
      else sessionStorage.setItem(ADMIN_SIDEBAR_COLLAPSED_KEY,next?'0':'1');
    }catch(_){}
  }
}
function syncAdminMenuState(){
  let saved=false;
  try{
    saved=isCompactAdminMenu()

      :sessionStorage.getItem(ADMIN_SIDEBAR_COLLAPSED_KEY)!=='1';
  }catch(_){saved=!isCompactAdminMenu();}
  setAdminMenuOpen(saved,{persist:false});
}
function getAdminFilterStorageKey(key){
  return `${ADMIN_FILTER_OPEN_KEY}:${page||'dashboard'}:${key||'filter'}`;
}
function getAdminFilterOpen(key){
  try{
    const saved=sessionStorage.getItem(getAdminFilterStorageKey(key));
    if(saved!==null)return saved==='1';
  }catch(_){}
  return false;
}
function setAdminFilterOpen(shell,open,{persist=true}={}){
  if(!shell)return;
  const next=!!open;
  shell.classList.toggle('is-open',next);
  shell.classList.toggle('is-collapsed',!next);
  const toggle=shell.querySelector('[data-admin-filter-toggle]');
  if(toggle){
    toggle.setAttribute('aria-expanded',next?'true':'false');
    const text=toggle.querySelector('.admin-filter-toggle-text');
    const label=shell.dataset.adminFilterLabel||'검색 필터';
    if(text)text.textContent=next?`${label} 닫기`:label;
  }
  const body=shell.querySelector('.admin-filter-body');
  if(body)body.hidden=!next;
  if(persist&&shell.dataset.adminFilterKey){
    try{sessionStorage.setItem(getAdminFilterStorageKey(shell.dataset.adminFilterKey),next?'1':'0');}catch(_){}
  }
}
function getAdminFilterLabel(node){
  const title=node?.querySelector?.('.franchise-filter-title');
  return (title?.textContent||'').trim()||'검색 필터';
}
function decorateAdminFilterBlock(node,key){
  if(!node||node.closest('.admin-filter-shell'))return;
  const parent=node.parentNode;
  if(!parent)return;
  const shell=document.createElement('div');
  shell.className='admin-filter-shell';
  shell.dataset.adminFilterKey=key||'filter';
  shell.dataset.adminFilterLabel=getAdminFilterLabel(node);
  const toggle=document.createElement('button');
  toggle.type='button';
  toggle.className='admin-filter-toggle';
  toggle.dataset.adminFilterToggle='1';
  toggle.setAttribute('aria-expanded','false');
  toggle.innerHTML='<span class="admin-filter-toggle-text">검색 필터</span><span class="admin-filter-toggle-icon" aria-hidden="true">▾</span>';
  const body=document.createElement('div');
  body.className='admin-filter-body';
  parent.insertBefore(shell,node);
  shell.appendChild(toggle);
  shell.appendChild(body);
  body.appendChild(node);
  setAdminFilterOpen(shell,getAdminFilterOpen(shell.dataset.adminFilterKey),{persist:false});
}
function setupAdminFilterCollapse(){
  const root=document.getElementById('ct');
  if(!root)return;
  const selectors=[
    '.account-export-filters',
    '.franchise-filter-card',
    '.payment-filter-card',
    '.accounts-filter-card',
    '.talk-admin-filters',
    '.settlement-compact-panel'
  ];
  let index=0;
  selectors.forEach(sel=>{
    root.querySelectorAll(sel).forEach(node=>{
      decorateAdminFilterBlock(node,`${sel.replace(/[^a-z0-9_-]/gi,'')}-${index++}`);
    });
  });
  root.querySelectorAll('.sb2').forEach(node=>{
    if(node.querySelector('[data-ag-filter]'))decorateAdminFilterBlock(node,`agency-filter-${index++}`);
  });
  root.querySelectorAll('.admin-filter-shell').forEach(shell=>{
    setAdminFilterOpen(shell,getAdminFilterOpen(shell.dataset.adminFilterKey),{persist:false});
  });
}

  const contracts=Array.isArray(account?.pgContracts)?account.pgContracts:[];

    iv:routeup.initializationVector||routeup.initializationVectorMasked||routeup.hasInitializationVector||metadata.initializationVector||metadata.initializationVectorMasked||metadata.hasInitializationVector||metadata.iv||metadata.ivMasked||''
  };

function accountHasCompleteRouteupExternalKeys(account={},franchise={}){
  const provider=accountPgProviderName(account?.pgProviderName||franchise?.pgProviderName||'');
  const hasRouteupContract=(Array.isArray(account?.pgContracts)?account.pgContracts:[]).some(contract=>accountPgProviderName(contract?.providerName)==='위루트');
  if(provider!=='위루트'&&!hasRouteupContract)return false;
  return Boolean(
    routeupExternalKeyValueFromAccount(account,'api')&&
    routeupExternalKeyValueFromAccount(account,'encryption')&&
    routeupExternalKeyValueFromAccount(account,'iv')
  );
}
function accountPendingApproval(account,franchise={}){
  if(accountHasCompleteRouteupExternalKeys(account,franchise))return false;
  const raw=String(account?.approvalStatus||account?.status||'').toUpperCase();
  if(['PENDING','APPROVED','REJECTED'].includes(raw))return raw==='PENDING';
  return account?.accountStatus==='승인대기'&&!String(account?.exportReadyAt||'').trim();
}

function accountVerifiedForExport(account,franchise={}){
  if(account?.hidden===true)return false;
  if(accountHasCompleteRouteupExternalKeys(account,franchise))return false;
  if(!String(account?.exportReadyAt||'').trim())return false;
  if(String(account?.exportedAt||account?.exported_at||'').trim())return false;
  const recurringTid=String(account?.recurringTid||account?.recurring_tid||account?.txid||'').trim();
  const hasRecurringKey=account?.hasRecurringKey===true||String(account?.recurringKey||account?.recurring_key||account?.recurringKeyMasked||'').trim();

function accountMatchesExportFilters(account,franchise={},options={}){

  const readyDate=dateOnly(account.exportReadyAt||account.approvedAt||account.reqDate);
  if(accountExportFilters.startDate&&readyDate<accountExportFilters.startDate)return false;
  if(accountExportFilters.endDate&&readyDate>accountExportFilters.endDate)return false;
  if(accountExportFilters.agency&&String(account.agency||'')!==accountExportFilters.agency)return false;
  const accountProvider=accountPgProviderName(franchise.pgProviderName)||'GH Payments';
  const providerOverride=accountPgProviderName(options.pgProvider||'');
  if(providerOverride&&accountProvider!==providerOverride)return false;
  if(options.includePgProvider!==false&&accountExportFilters.pgProvider&&accountProvider!==accountPgProviderName(accountExportFilters.pgProvider))return false;
  const q=String(accountExportFilters.q||'').trim().toLowerCase();
  if(q){
    const hay=[
      franchise.name,franchise.owner,franchise.businessNo,franchise.businessNumber,
      account.agency,account.bankName,account.accountNo,account.accountHolder
    ].join(' ').toLowerCase();

  }
  return true;
}

function canAccessPage(id){

    const agentAllowed=new Set(AG_NAV.filter(item=>item.id).map(item=>item.id).concat(['franchiseDetail']));

  }
  if(id==='eatsgoAdmin')return currentAdminLevel()==='SUPER';
  if(SYSTEM_ADMIN_ONLY_PAGES.has(id))return isSystemAdminLogin();
  if(currentAdminLevel()==='SUPER')return true;
  const perms=Array.isArray(currentAdmin?.adminPermissions)?currentAdmin.adminPermissions:[];

    if(id==='franchiseDetail'&&perms.includes('franchises'))return true;

  const base=new Date(referenceDate.getFullYear(),referenceDate.getMonth(),referenceDate.getDate());
  const daysUntilFriday=(5-base.getDay()+7)%7;
  return addDateDays(base,daysUntilFriday);
}
function getAgencySettlementCycle(referenceDate=new Date()){
  const base=new Date(referenceDate.getFullYear(),referenceDate.getMonth(),referenceDate.getDate());
  const weekStart=addDateDays(base,-((base.getDay()+6)%7));
  const weekEnd=addDateDays(weekStart,6);
  const payout=addDateDays(weekStart,11);
  return {
    payoutDate:dateInputValue(payout),
    startDate:dateInputValue(weekStart),
    endDate:dateInputValue(weekEnd),
    rule:'금주 월요일부터 일요일까지의 거래를 1주 뒤 금요일에 지급합니다.'

function applyAdminTableColumnWidthStyles(table,overrideKey=null,overrideWidth=null){

function startAdminTableColumnResize(ev,table,index,th){

  adminTableResizingUntil=Date.now()+700;
  const startX=ev.clientX,startW=th.offsetWidth;
  table.classList.add('admin-table-fixed');
  const key=adminTableWidthKey(table,index);
  let currentW=startW;
  const move=e=>{adminTableResizingUntil=Date.now()+700;currentW=normalizeAdminTableColumnWidth(startW+(e.clientX-startX));applyAdminTableColumnWidthStyles(table,key,currentW);};
  const up=()=>{
    adminTableResizingUntil=Date.now()+700;
    const widths=getAdminTableWidths();
    widths[key]=currentW;
    localStorage.setItem(ADMIN_TABLE_COL_WIDTH_KEY,JSON.stringify(widths));
    applyAdminTableColumnWidthStyles(table);
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
  };

}

function compareAdminTableRows(a,b,index,dir){
  const av=adminTableCellValue(a,index),bv=adminTableCellValue(b,index);
  let cmp=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'ko');
  if(cmp===0)cmp=(Number(a.dataset.originalIndex||0)-Number(b.dataset.originalIndex||0));
  return dir==='desc'?-cmp:cmp;
}
function agencyTreeSortRank(row){
  const ranks={hq:0,bonbu:1,jisa:2,jijum:3};
  const key=String(row?.dataset?.treeType||'');
  return Object.prototype.hasOwnProperty.call(ranks,key)?ranks[key]:Number(row?.dataset?.treeDepth||0);
}
function sortAdminAgencyTreeTableByHeader(table,index,th){
  const tbody=table.tBodies?.[0];
  if(!tbody)return;
  ensureAdminTableOriginalOrder(table);
  const next=th.dataset.sortDir==='asc'?'desc':'asc';
  setAdminTableSortHeaderState(table,th,next);
  const rows=[...tbody.rows];
  const agencyRows=rows.filter(row=>row.dataset.treeNode==='agency');
  const franchiseRows=rows.filter(row=>row.dataset.treeNode==='franchise');
  if(!agencyRows.length&&!franchiseRows.length)return;
  const agencyById=new Map(agencyRows.map(row=>[String(row.dataset.treeId||''),row]));
  const agencyChildrenByParent=new Map();
  const franchiseChildrenByParent=new Map();
  const rootAgencies=[];
  const orphanFranchises=[];
  const addChild=(map,parentId,row)=>{
    const key=String(parentId||'');
    if(!map.has(key))map.set(key,[]);
    map.get(key).push(row);
  };
  agencyRows.forEach(row=>{
    const parentId=String(row.dataset.treeParentId||'');
    if(parentId&&agencyById.has(parentId))addChild(agencyChildrenByParent,parentId,row);
    else rootAgencies.push(row);
  });
  franchiseRows.forEach(row=>{
    const parentId=String(row.dataset.treeParentId||'');
    if(parentId&&agencyById.has(parentId))addChild(franchiseChildrenByParent,parentId,row);
    else orphanFranchises.push(row);
  });
  const sortAgencySiblings=items=>items.slice().sort((a,b)=>{
    const rank=agencyTreeSortRank(a)-agencyTreeSortRank(b);
    if(rank!==0)return rank;
    return compareAdminTableRows(a,b,index,next);
  });
  const sortFranchiseSiblings=items=>items.slice().sort((a,b)=>compareAdminTableRows(a,b,index,next));
  function appendAgencyBranch(row){
    tbody.appendChild(row);
    const id=String(row.dataset.treeId||'');
    sortAgencySiblings(agencyChildrenByParent.get(id)||[]).forEach(appendAgencyBranch);
    sortFranchiseSiblings(franchiseChildrenByParent.get(id)||[]).forEach(row=>tbody.appendChild(row));
  }
  sortAgencySiblings(rootAgencies).forEach(appendAgencyBranch);
  sortFranchiseSiblings(orphanFranchises).forEach(row=>tbody.appendChild(row));
  rows
    .filter(row=>!row.dataset.treeNode)
    .sort((a,b)=>Number(a.dataset.originalIndex||0)-Number(b.dataset.originalIndex||0))
    .forEach(row=>tbody.appendChild(row));
  scheduleAgencyTreeNetworkDraw();
}
function sortAdminTableByHeader(table,index,th){
  const tbody=table.tBodies?.[0];
  if(!tbody)return;
  if(table.classList.contains('admin-agency-tree-table'))return sortAdminAgencyTreeTableByHeader(table,index,th);
  ensureAdminTableOriginalOrder(table);
  const next=th.dataset.sortDir==='asc'?'desc':'asc';
  setAdminTableSortHeaderState(table,th,next);
  const rows=[...tbody.rows];
  rows.sort((a,b)=>compareAdminTableRows(a,b,index,next)).forEach(row=>tbody.appendChild(row));
}
function enableAdminTableSorting(root=document){
  root.querySelectorAll('table').forEach((table,tableIndex)=>{
    const tbody=table.tBodies?.[0];
    const headerRow=table.tHead?.rows?.[0];
    if(!tbody||!headerRow||table.dataset.adminSortBound==='1'||table.dataset.noAdminSort==='1')return;
    table.dataset.adminSortBound='1';
    table.dataset.adminSortId=table.dataset.adminSortId||stableAdminTableSortId(table,tableIndex);
    captureAdminTableOriginalOrder(table);
    [...headerRow.cells].forEach((th,index)=>{
      th.classList.add('admin-resizable-th');
      applyAdminTableColumnWidth(table,index);
      if(!th.querySelector('.admin-col-resizer')){
        const grip=document.createElement('span');
        grip.className='admin-col-resizer';
        grip.title='드래그: 열 너비 조절';
        grip.addEventListener('mousedown',ev=>startAdminTableColumnResize(ev,table,index,th));
        grip.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();});
        grip.addEventListener('dblclick',ev=>{ev.preventDefault();ev.stopPropagation();});
        th.appendChild(grip);
      }
      if(th.dataset.noSort==='1'||th.querySelector('button'))return;
      th.classList.add('admin-sortable-th');
      th.title='클릭: 정렬 / 더블클릭: 정렬 초기화';
      const text=th.textContent.trim();
      th.innerHTML=`<span>${esc(text)}</span> <span class="admin-sort-label">↕</span><span class="admin-col-resizer" title="드래그: 열 너비 조절"></span>`;
      const sortGrip=th.querySelector('.admin-col-resizer');
      sortGrip?.addEventListener('mousedown',ev=>startAdminTableColumnResize(ev,table,index,th));
      sortGrip?.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();});
      sortGrip?.addEventListener('dblclick',ev=>{ev.preventDefault();ev.stopPropagation();});
      th.addEventListener('click',ev=>{
        if(ev.detail>1)return;
        if(Date.now()<adminTableResizingUntil)return;
        if(ev.target.closest?.('.admin-col-resizer'))return;
        sortAdminTableByHeader(table,index,th);
      });
      th.addEventListener('dblclick',ev=>{
        ev.preventDefault();
        if(Date.now()<adminTableResizingUntil)return;
        if(ev.target.closest?.('.admin-col-resizer'))return;
        resetAdminTableSort(table);
      });
    });
  });
}

async function submitAdminLogin(){
  const email=v('admin-login-email').trim();
  const password=adminPasswordValue('admin-login-password');
  adminLoginPasswordDraft=password;
  if(!email){setAdminLoginError('관리자 이메일을 입력하세요.','admin-login-email');return;}
  if(!password){setAdminLoginError('비밀번호를 입력하세요.','admin-login-password');return;}
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const json=await res.json().catch(()=>({}));
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'로그인에 실패했습니다.');
    const loginRole=json.data?.user?.role||'';
    if(!['ADMIN','AGENCY'].includes(loginRole))throw new Error('관리자 또는 대리점 권한 계정이 아닙니다.');
    adminRuntimeToken=json.data.accessToken||'';
    currentAdmin=json.data.user||null;
    applyCurrentAdminRole();
    sessionStorage.removeItem(ADMIN_TOKEN_KEY);
    localStorage.setItem(ADMIN_TOKEN_KEY,adminRuntimeToken);
    localStorage.setItem(ADMIN_USER_KEY,JSON.stringify(currentAdmin||{}));
    if(document.getElementById('admin-login-remember')?.checked){
      localStorage.setItem('eatspayAdminRememberId','1');
      localStorage.setItem('eatspayAdminEmail',email);
    }else{
      localStorage.removeItem('eatspayAdminRememberId');
      localStorage.removeItem('eatspayAdminEmail');
    }
    setAdminLocked(false);
    closeM();
    adminLoginPasswordDraft='';
    page=canAccessPage(page)?page:firstAllowedPage();
    render();
    syncBackendTransactions({silent:true}).then(()=>render()).catch(()=>{});
    window.__adminLoginResolve&&window.__adminLoginResolve(true);
  }catch(e){
    const raw=String(e.message||'');
    const message=/Invalid (email|loginId) or password/i.test(raw)?'아이디 또는 비밀번호가 일치하지 않습니다. 다시 입력해주세요.':(raw||'로그인에 실패했습니다.');
    setAdminLoginError(message,'admin-login-password');
  }
}
async function ensureAdminLogin(){
  if(adminToken()){setAdminLocked(false);return true;}
  const savedToken=localStorage.getItem(ADMIN_TOKEN_KEY)||sessionStorage.getItem(ADMIN_TOKEN_KEY)||'';
  if(savedToken){
    adminRuntimeToken=savedToken;
    try{currentAdmin=JSON.parse(localStorage.getItem(ADMIN_USER_KEY)||'null')||currentAdmin;}catch(_){}
    applyCurrentAdminRole();
    setAdminLocked(false);
    return true;
  }
  return showAdminLogin();
}
async function handleAdminUnauthorized(res){
  if(res.status!==401)return false;
  adminRuntimeToken='';
  sessionStorage.removeItem(ADMIN_TOKEN_KEY);
  localStorage.removeItem(ADMIN_TOKEN_KEY);
  localStorage.removeItem(ADMIN_USER_KEY);

  await showAdminLogin('세션이 만료되었거나 관리자 권한 확인이 필요합니다.');

}

function dateOnly(value){
  return String(value||'').slice(0,10);
}
function formatKstDateTime(value){
  if(!value)return'-';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value);
  return new Intl.DateTimeFormat('ko-KR',{
    timeZone:'Asia/Seoul',
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  }).format(d).replace(/\\.\\s?/g,'-').replace(/-$/,'');
}
function addDays(date,days){
  const d=new Date(date);
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtShort(n){
  const v=Number(n||0);
  if(Math.abs(v)>=100000000)return `${(v/100000000).toFixed(v%100000000?1:0)}억`;
  if(Math.abs(v)>=10000)return `${Math.round(v/10000).toLocaleString()}만`;
  return v.toLocaleString();
}
function svgBar(labels,values,color='#3D9B35'){
  const max=Math.max(1,...values.map(v=>Number(v)||0));
  const bars=values.map((v,i)=>{
    const h=Math.max(4,Math.round((Number(v)||0)/max*86));
    const x=24+i*44;
    const y=104-h;
    return `<g><rect x="${x}" y="${y}" width="24" height="${h}" rx="5" fill="${color}" opacity=".88"></rect><text x="${x+12}" y="122" text-anchor="middle" font-size="10" fill="#6B7280">${labels[i]}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${Math.max(320,labels.length*44+42)} 132" class="admin-chart-svg"><line x1="16" y1="104" x2="${Math.max(300,labels.length*44+24)}" y2="104" stroke="#D1E8D1"/><text x="16" y="18" font-size="11" fill="#6B7280">최대 ${fmtShort(max)}</text>${bars}</svg>`;
}
function makeSalesChart(payments){
  const base=new Date();
  const labels=[];
  const values=[];
  for(let i=6;i>=0;i--){
    const day=addDays(base,-i);
    labels.push(day.slice(5).replace('-','.'));
    values.push(payments.filter(p=>dateOnly(p.date)===day).reduce((s,p)=>s+Number(p.amount||0),0));
  }
  return svgBar(labels,values,'#3B82F6');
}
function makeFranChart(franchises){
  const base=new Date();
  const labels=[];
  const values=[];
  for(let i=5;i>=0;i--){
    const end=addDays(base,-i*7);
    const start=addDays(end,-6);
    labels.push(`${end.slice(5,7)}/${end.slice(8,10)}`);
    values.push(franchises.filter(f=>dateOnly(f.joinDate||f.createdAt)>=start&&dateOnly(f.joinDate||f.createdAt)<=end).length);
  }
  return svgBar(labels,values,'#3D9B35');
}

    const name=String(item?.provider||'').trim();

  });

function resetPaymentPagination(){paymentPagination.page=1;}
function normalizePaymentPageSize(value){
  const size=Number(value||paymentPagination.pageSize||20);
  return [20,50,100].includes(size)?size:20;
}
function updatePaymentPaginationControls(){
  const pageSizeEl=document.getElementById('payment-page-size');
  if(pageSizeEl)pageSizeEl.value=String(normalizePaymentPageSize(paymentPagination.pageSize));
  const labelEl=document.getElementById('payment-page-label');
  if(labelEl)labelEl.textContent=`${paymentPagination.page.toLocaleString()} / ${paymentPagination.totalPages.toLocaleString()}`;
  document.querySelectorAll('[data-payment-page]').forEach(btn=>{
    const action=btn.dataset.paymentPage;
    btn.disabled=(action==='prev'&&paymentPagination.page<=1)||(action==='next'&&paymentPagination.page>=paymentPagination.totalPages);
  });
}
function normalizeAdminPageSize(value, fallback=20){
  const size=Number(value||fallback||20);
  return [20,50,100].includes(size)?size:20;
}
function updateSimplePaginationControls(state,prefix){
  const pageSizeEl=document.getElementById(`${prefix}-page-size`);
  if(pageSizeEl)pageSizeEl.value=String(normalizeAdminPageSize(state.pageSize));
  const labelEl=document.getElementById(`${prefix}-page-label`);
  if(labelEl)labelEl.textContent=`${Number(state.page||1).toLocaleString()} / ${Number(state.totalPages||1).toLocaleString()}`;
  document.querySelectorAll(`[data-${prefix}-page]`).forEach(btn=>{
    const action=btn.dataset[`${prefix.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())}Page`];
    btn.disabled=(action==='prev'&&state.page<=1)||(action==='next'&&state.page>=state.totalPages);
  });
}
function applyPagination(rows,state,prefix){
  const list=Array.isArray(rows)?rows:[];
  state.pageSize=normalizeAdminPageSize(state.pageSize);
  state.total=list.length;
  state.totalPages=Math.max(Math.ceil(list.length/state.pageSize),1);
  state.page=Math.min(Math.max(Number(state.page||1),1),state.totalPages);
  const start=(state.page-1)*state.pageSize;
  const pageRows=list.slice(start,start+state.pageSize);
  const resultEl=document.getElementById(`${prefix}-result-count`);
  if(resultEl)resultEl.textContent=list.length?`${(start+1).toLocaleString()}-${(start+pageRows.length).toLocaleString()} / ${list.length.toLocaleString()}건`:'0건';
  updateSimplePaginationControls(state,prefix);
  return pageRows;
}

function rPay(){
  const q=(v('ps')||'').toLowerCase(),an=v('pan'),sd=v('psd'),ed=v('ped'),st=v('pst');
  const cid=(v('pcid')||'').toLowerCase(),ptype=v('ptype'),ppg=v('ppg'),amin=Number(v('pamin')||0),amax=Number(v('pamax')||0);
  const selectedAgency=String(_sddSel.pag||''),selectedDa=String(_sddSel.pda||'');
  const el=document.getElementById('pb');if(!el)return;
  const rows=(role==='agent'?scopedPayments():(D.payments||[])).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).filter(p=>{
    const fr=paymentFranchise(p);
    const franchiseName=paymentFranchiseName(p);
    if(q&&!franchiseName.toLowerCase().includes(q)&&!(fr?.owner||'').toLowerCase().includes(q))return false;
    if(cid&&!(p.customerId||fr?.customerId||'').toLowerCase().includes(cid))return false;
    if(an&&!`${p.approvalNo||''} ${p.authCode||''}`.includes(an))return false;
    if(st&&p.status!==st)return false;
    if(selectedAgency&&paymentAgencyId(p)!==selectedAgency)return false;
    if(role==='agent'&&!isInAgentScopeAgencyId(paymentAgencyId(p)))return false;
    if(ptype&&p.type!==ptype)return false;
    if(ppg&&p.pg!==ppg)return false;
    if(selectedDa){
      const daName=p.usedDA||p.deliveryAgency||'';
      const hasDa=daName===selectedDa||(fr?.deliveryAgencies||[]).some(a=>a.agency===selectedDa);
      if(!hasDa)return false;
    }
    if(amin&&Number(p.amount||0)<amin)return false;
    if(amax&&Number(p.amount||0)>amax)return false;
    if(sd&&dateOnly(p.date)<sd)return false;
    if(ed&&dateOnly(p.date)>ed)return false;
    return true;
  });
  const total=rows.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const successTotal=rows.filter(p=>p.status==='결제완료').reduce((s,p)=>s+(Number(p.amount)||0),0);
  const cancelCount=rows.filter(p=>p.status&&p.status!=='결제완료').length;
  const totalEl=document.getElementById('pay-total');
  if(totalEl)totalEl.textContent=fmt(total);
  const countEl=document.getElementById('pay-count');
  if(countEl)countEl.textContent=`${rows.length.toLocaleString()}건`;
  const successEl=document.getElementById('pay-success-total');
  if(successEl)successEl.textContent=fmt(successTotal);
  const cancelEl=document.getElementById('pay-cancel-count');
  if(cancelEl)cancelEl.textContent=`${cancelCount.toLocaleString()}건`;
  paymentPagination.pageSize=normalizePaymentPageSize(paymentPagination.pageSize);
  paymentPagination.total=rows.length;
  paymentPagination.totalPages=Math.max(Math.ceil(rows.length/paymentPagination.pageSize),1);
  paymentPagination.page=Math.min(Math.max(Number(paymentPagination.page||1),1),paymentPagination.totalPages);
  const pageStart=(paymentPagination.page-1)*paymentPagination.pageSize;
  const pageRows=rows.slice(pageStart,pageStart+paymentPagination.pageSize);
  const resultEl=document.getElementById('payment-result-count');
  if(resultEl)resultEl.textContent=rows.length?`${(pageStart+1).toLocaleString()}-${(pageStart+pageRows.length).toLocaleString()} / ${rows.length.toLocaleString()}건`:'0건';
  updatePaymentPaginationControls();
  el.innerHTML=pageRows.map(p=>{
    const fr=paymentFranchise(p);
    const customerId=p.customerId||fr?.customerId||'-';
    const cancelBtn=p.status==='결제완료'?`<button type="button" class="btn bd xs" data-payment-cancel-guide="${esc(p.approvalNo||p.id||'')}">취소</button>`:'';
    const dateText=String(p.date||'-');
    const dateParts=dateText.split(' ');
    const dateHtml=dateParts.length>1?`${esc(dateParts[0])}<br><span class="payment-date-sub">${esc(dateParts.slice(1).join(' '))}</span>`:esc(dateText);
    return`<tr><td class="payment-date-cell">${dateHtml}</td><td>${esc(p.agency||agencyNameById(paymentAgencyId(p))||'-')}</td><td class="payment-franchise-name">${esc(paymentFranchiseName(p))}</td><td>${esc(p.type||'-')}</td><td class="tg payment-amount-cell">${fmt(p.amount)}</td><td>${esc(p.installment||'-')}</td><td><span class="payment-approval-link" data-payment-receipt-id="${esc(p.id||p.approvalNo||'')}">${esc(p.approvalNo||p.id||'-')}</span></td><td class="admin-mono admin-text-small">${esc(p.authCode||'-')}</td><td>${bdg(p.status)}</td><td class="payment-customer-id">${esc(customerId)}</td><td>${esc(p.pg||'-')}</td><td>${cancelBtn}</td></tr>`;
  }).join('')||'<tr><td colspan="12" class="emp">검색 결과 없음</td></tr>';
}

function ensureSettlementFilters(){
  if(role==='agent'){
    window._settleAgId=currentAgentAgencyId();
  }
  if(window._settleAgId===undefined)window._settleAgId='';
  const scope=role==='agent'?'agent':'hq';
  const defaultRange='week';
  if(window._settleDefaultScope!==scope||!window._settleSd||!window._settleEd){
    setSettlementRange(defaultRange,false);
    window._settleDefaultScope=scope;
  }
}
function setSettlementRange(type,rerender=true){
  const now=new Date();
  window._settleCycle=null;
  if(type==='settlementCycle'){
    const cycle=getAgencySettlementCycle(now);
    window._settleSd=cycle.startDate;
    window._settleEd=cycle.endDate;
    window._settleCycle=cycle;
  }else if(type==='week'){
    window._settleSd=dateInputValue(addDateDays(now,-6));
    window._settleEd=dateInputValue(now);
  }else if(type==='month'){
    const start=new Date(now.getFullYear(),now.getMonth()-1,now.getDate());
    window._settleSd=dateInputValue(start);
    window._settleEd=dateInputValue(now);
  }else if(type==='quarter'){
    const start=new Date(now.getFullYear(),now.getMonth()-3,now.getDate());
    window._settleSd=dateInputValue(start);
    window._settleEd=dateInputValue(now);
  }else if(type==='all'){
    window._settleSd='2026-01-01';
    window._settleEd=today();
  }else{
    window._settleSd=dateInputValue(addDateDays(now,-6));
    window._settleEd=dateInputValue(now);
  }
  if(rerender)renderPage();
}

  if(d<0)return '';

function agencyTreeLineCell(name,labelDepth,branchDepth,{franchise=false,franchisePosition=''}={}){
  const label=Math.min(Math.max(Number(labelDepth)||0,0),3);
  const branch=Number(branchDepth);
  const hasBranch=Number.isFinite(branch)&&branch>=0;
  const safeBranch=hasBranch?Math.min(Math.max(branch,0),3):'none';
  const cls=[
    'admin-tree-name-cell',
    'admin-tree-line-cell',
    `admin-tree-label-depth-${label}`,
    `admin-tree-branch-depth-${safeBranch}`,
    franchise?'admin-tree-franchise-name-cell admin-tree-franchise-line':'admin-tree-agency-line',
    franchise&&franchisePosition?`admin-tree-franchise-${franchisePosition}`:''
  ].join(' ');
  return `<td class="${cls}">${agencyTreeRails(hasBranch?safeBranch:-1)}<span class="admin-tree-line-label">${esc(name||'-')}</span></td>`;
}
function agencyTreeNameCell(name,depth,isFranchise=false,opts={}){
  const d=Math.min(Math.max(Number(depth)||0,0),3);
  return agencyTreeLineCell(name,d,d>0?d-1:-1,{franchise:isFranchise});
}
function agencyFranchiseTreeNameCell(name,parentDepth,opts={}){
  const d=Math.min(Math.max(Number(parentDepth)||0,0),3);
  return agencyTreeLineCell(name,Math.min(d+1,3),d,{franchise:true,franchisePosition:opts.position||''});
}
function agencyTreeDepth(ag){
  let depth=0,current=ag,guard=0;
  while(current?.parentId&&guard<10){
    depth+=1;
    current=(D.agencies||[]).find(item=>String(item.id)===String(current.parentId));
    guard+=1;
  }
  return depth;
}
function agencySortKey(ag){
  const rank=agencyTypeRank(ag);
  const path=[];
  let current=ag,guard=0;
  while(current&&guard<10){
    const currentRank=agencyTypeRank(current);
    path.unshift(`${currentRank}-${String(current.name||current.id).padStart(4,'0')}`);
    current=(D.agencies||[]).find(item=>String(item.id)===String(current.parentId));
    guard+=1;
  }
  return `${rank}/${path.join('/')}/${String(ag.id).padStart(5,'0')}`;
}

}

function franchiseCardItems(f){

function franchiseCardProviderId(card){return String(card?.pgProviderId||card?.pg_provider_id||card?.providerId||'').trim();}
function franchiseCurrentProviderId(f){return String(f?.pgProviderId||f?.pg_provider_id||f?.providerId||'').trim();}
function franchiseIsCurrentVisibleCard(f,card){
  if(!card||card.hidden===true||card.active===false)return false;

function deliveryAccountVisibleKey(account){
  const fn=eatsFrUtils().deliveryAccountVisibleKey;

}
function uniqueVisibleAccounts(accounts){
  const fn=eatsFrUtils().uniqueVisibleAccounts;
  if(typeof fn==='function')return fn(accounts);
  const seen=new Set();
  return(Array.isArray(accounts)?accounts:[]).filter(account=>{if(account?.hidden===true)return false;const key=deliveryAccountVisibleKey(account);if(key&&seen.has(key))return false;if(key)seen.add(key);return true;});
}
function franchiseVisibleCardItems(f){const fn=eatsFrUtils().visibleCardItems;return typeof fn==='function'?fn(f):franchiseCardItems(f).filter(card=>franchiseIsCurrentVisibleCard(f,card));}
function franchiseVisibleAccounts(f){const fn=eatsFrUtils().visibleAccounts;return typeof fn==='function'?fn(f):uniqueVisibleAccounts(f?.deliveryAgencies);}
function franchiseVisibleAccountEntries(f){

  if(typeof fn==='function')return fn(f);
  const seen=new Set();
  return(Array.isArray(f?.deliveryAgencies)?f.deliveryAgencies:[]).map((account,idx)=>({account,idx})).filter(entry=>{if(entry.account?.hidden===true)return false;const key=deliveryAccountVisibleKey(entry.account);if(key&&seen.has(key))return false;if(key)seen.add(key);return true;});

function franchiseDisplayLineDate(line){

function normalizeCardMatchName(value){
  const fn=eatsFrUtils().normalizeCardMatchName;
  return typeof fn==='function'?fn(value):String(value||'').replace(/\s+/g,'').replace(/^KB/,'').replace(/^케이비/,'').replace(/카드$/,'').toLowerCase();
}
function franchisePaymentDateForCard(f,card){
  const fn=eatsFrListUtils().paymentDateForCard;
  if(typeof fn==='function')return fn(f,card,franchiseListContext());
  if(!card)return'';
  const cardLast=String(card.cardLast4||card.maskedNumber||card.cardNumber||'').replace(/[^0-9]/g,'').slice(-4);
  if(!cardLast)return'';
  const cardName=normalizeCardMatchName(card.cardCompany||card.cardName||card.alias||'');
  const payments=(D.payments||[])
    .filter(p=>String(p.franchiseId||'')===String(f.id)||paymentFranchiseName(p)===f.name)
    .map(payment=>({
      date:dateOnly(payment.date||payment.createdAt||payment.paymentDate||''),
      last:String(payment.cardLast4||payment.maskedNumber||payment.cardNumber||'').replace(/[^0-9]/g,'').slice(-4),
      name:normalizeCardMatchName(payment.cardCompany||payment.cardName||payment.cardAlias||'')
    }))
    .filter(payment=>payment.date&&payment.last===cardLast);
  if(!payments.length)return'';
  const exact=payments.filter(payment=>payment.name&&cardName&&(payment.name===cardName||payment.name.includes(cardName)||cardName.includes(payment.name)));
  const cardSameLastCount=franchiseVisibleCardItems(f).filter(item=>String(item.cardLast4||item.maskedNumber||item.cardNumber||'').replace(/[^0-9]/g,'').slice(-4)===cardLast).length;
  const candidates=exact.length?exact:(cardSameLastCount===1?payments:[]);
  return candidates.map(payment=>payment.date).sort().pop()||'';
}
function franchiseSortedDisplayLines(f){
  const fn=eatsFrListUtils().sortedDisplayLines;
  if(typeof fn==='function')return fn(f,franchiseListContext());
  const cards=franchiseVisibleCardItems(f).map((card,index)=>({
    card,
    index,
    matchedPaymentDate:franchisePaymentDateForCard(f,card)
  })).sort((a,b)=>{
    const ad=String(a.matchedPaymentDate||'0000-00-00');
    const bd=String(b.matchedPaymentDate||'0000-00-00');
    if(ad!==bd)return bd.localeCompare(ad);
    return a.index-b.index;
  });
  const accounts=franchiseVisibleAccountEntries(f);
  const count=Math.max(1,cards.length,accounts.length);
  return Array.from({length:count},(_,i)=>({
    index:i,
    card:cards[i]?.card||null,
    accountEntry:accounts[i]||accounts[accounts.length-1]||null,
    matchedPaymentDate:cards[i]?.matchedPaymentDate||''
  }));
}
function franchiseVisibleAccountStatus(f){
  const fn=eatsFrListUtils().visibleAccountStatus;
  if(typeof fn==='function')return fn(f,franchiseListContext());
  const accounts=franchiseVisibleAccounts(f);
  if(!accounts.length)return'미등록';
  if(role!=='hq'){
    if(accounts.some(a=>a.accountStatus==='반려'))return'반려';
    if(accounts.some(a=>a.accountStatus==='승인대기'))return'승인대기';
    if(accounts.some(a=>a.accountStatus==='승인완료'))return'승인완료';
    return accounts[0]?.accountStatus||'미등록';
  }
  if(accounts.some(a=>a.accountStatus==='반려'))return'반려';
  if(accounts.some(a=>a.accountStatus==='승인대기'&&!franchiseAccountHasApprovalCredentials(a,f)))return'승인대기';
  if(accounts.some(a=>a.accountStatus==='승인완료'&&franchiseAccountHasApprovalCredentials(a,f)))return'승인완료';
  if(accounts.some(a=>a.accountStatus==='승인대기'&&accountHasCompleteRouteupExternalKeys(a,f)))return'승인완료';
  if(accounts.some(a=>a.accountStatus==='승인완료'))return'승인대기';
  return accounts[0]?.accountStatus||'미등록';
}
function franchiseAccountHasTidKey(account={}){
  const contracts=Array.isArray(account.pgContracts)?account.pgContracts:[];
  if(contracts.some(contract=>{
    const provider=accountPgProviderName(contract.providerName);
    if(provider==='위루트')return Boolean(contract.mid&&contract.tid&&(contract.hasPaymentKey||contract.paymentKey||contract.paymentKeyMasked));
    if(provider==='GH Payments')return contract.credentialType==='recurring'&&Boolean(contract.tid&&(contract.hasPaymentKey||contract.paymentKey||contract.paymentKeyMasked));
    return Boolean(contract.tid&&(contract.hasPaymentKey||contract.paymentKey||contract.paymentKeyMasked));
  }))return true;
  return Boolean(String(account.recurringTid||account.txid||'').trim()&&(account.hasRecurringKey===true||String(account.recurringKeyMasked||'').trim()));
}
function franchiseAccountHasApprovalCredentials(account={},f={}){
  const provider=accountPgProviderName(account?.pgProviderName||f?.pgProviderName||'');
  if(provider==='위루트')return accountHasCompleteRouteupExternalKeys(account,f);
  return franchiseAccountHasTidKey(account)||accountHasCompleteRouteupExternalKeys(account,f);
}
function franchiseAccountDisplayStatus(account,f){
  const raw=String(account?.accountStatus||franchiseVisibleAccountStatus(f)||'미등록');

  if(raw==='승인대기'&&accountHasCompleteRouteupExternalKeys(account,f))return'승인완료';
  if(raw==='승인완료'&&!franchiseAccountHasApprovalCredentials(account,f))return'승인대기';
  return raw;
}

function resolveFranchisePaymentCardLabel(f,s,p){
  const rawName=String(s?.cardCompany||p?.cardCompany||'').trim();
  const rawLast=String(s?.cardLast4||s?.maskedNumber||p?.cardLast4||p?.maskedNumber||'').replace(/[^0-9]/g,'').slice(-4);
  const cards=franchiseVisibleCardItems(f).map(card=>{
    const name=String(card.cardCompany||card.cardName||card.alias||'카드').trim()||'카드';
    const last=String(card.cardLast4||card.maskedNumber||card.cardNumber||'').replace(/[^0-9]/g,'').slice(-4);
    return{name,last};
  }).filter(card=>card.last);
  const matches=rawLast?cards.filter(card=>card.last===rawLast):[];
  let matched=null;
  if(matches.length===1){
    matched=matches[0];
  }else if(matches.length>1){
    matched=matches.find(card=>rawName&&(card.name===rawName||card.name.includes(rawName)||rawName.includes(card.name)))||matches[0];
  }
  const name=matched?.name||rawName||'카드';
  const last=matched?.last||rawLast;
  return last?`${name} ****-${last}`:name;
}
async function updateFranchiseCardAlias(fid,cardId,btn){

  btn.disabled=true;
  try{
    const res=await fetch(`/api/admin/cards/${encodeURIComponent(cardId)}/alias`,{
      method:'PATCH',
      headers:adminAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({alias})
    });
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res))return;
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'카드별칭 저장에 실패했습니다.');
    await syncBackendTransactions();

  }finally{
    btn.disabled=false;
  }
}

function displayMemberId(value){
  const email=String(value||'').trim();
  if(!email)return'-';
  return email.includes('@')?email.split('@')[0]:email;
}
function validEmailValue(value){
  const email=String(value||'').trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?email:'';
}
function franchiseDisplayEmail(f){
  const email=validEmailValue(f?.email)||validEmailValue(f?.contactEmail)||validEmailValue(f?.payerEmail);
  if(email)return esc(email);
  const fallback=String(f?.loginId||f?.customerId||'').trim();
  return fallback.includes('@')?esc(fallback):'-';
}
function isNewFranchise(f){
  const raw=dateOnly(f?.createdAt||f?.joinDate);
  if(!raw)return false;
  const joined=new Date(`${raw}T00:00:00`);
  const now=new Date();
  const todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.floor((todayDate-joined)/86400000);
  return diff>=0&&diff<7;
}
function isRecentPayment(p){
  const raw=dateOnly(p?.date||p?.createdAt||p?.paidAt);
  if(!raw)return false;
  const paid=new Date(`${raw}T00:00:00`);
  const now=new Date();
  const todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.floor((todayDate-paid)/86400000);
  return diff>=0&&diff<7;
}

function afterDate(value,start){

  if(start&&!d)return false;

}

function getFilteredFranchiseRows(){
  const q=franchiseFilters.q.toLowerCase(),accountStatus=franchiseFilters.accountStatus,cardFilter=franchiseFilters.cardFilter,agencyFilter=franchiseFilters.agencyFilter,joinStart=franchiseFilters.joinStart,joinEnd=franchiseFilters.joinEnd,payStart=franchiseFilters.payStart,payEnd=franchiseFilters.payEnd;
  const baseRows=role==='agent'?scopedFranchises():(D.franchises||[]);
  const rows=baseRows.filter(f=>{
    if(accountStatus&&franchiseAccountStatus(f)!==accountStatus)return false;
    if(cardFilter==='yes'&&!franchiseCardRegistered(f))return false;
    if(cardFilter==='no'&&franchiseCardRegistered(f))return false;
    if(agencyFilter&&String(f.agencyId||'')!==agencyFilter)return false;
    if(!afterDate(f.joinDate||f.createdAt,joinStart))return false;
    if(!beforeDate(f.joinDate||f.createdAt,joinEnd))return false;
    if(!afterDate(f.lastPaymentDate,payStart))return false;
    if(!beforeDate(f.lastPaymentDate,payEnd))return false;
    if(!q)return true;
    return String(f.name||'').toLowerCase().includes(q)||String(f.phone||'').includes(q)||String(f.owner||'').toLowerCase().includes(q);
  });
  return {baseRows,rows};
}

  };

function removedAgencyAccountRef(account){
  const source=String(account?.source||'').trim();
  const requestId=String(account?.requestId||'').trim();
  const id=account?.id!=null?String(account.id).trim():'';
  if(source==='account_request'||requestId)return{source:'account_request',id:requestId||id};
  if(source==='delivery_account'&&id)return{source:'delivery_account',id};
  return null;
}
function queueRemovedAgencyAccount(account){
  const ref=removedAgencyAccountRef(account);
  if(!ref?.id)return;
  if(removedEditingAgencies.some(item=>item.source===ref.source&&String(item.id)===String(ref.id)))return;
  removedEditingAgencies.push(ref);
}
function removeDARow(idx){
  const target=editingAgencies[idx];
  if(target&&(target.accountStatus==='승인완료'||String(target.txid||'').trim())){
    adminAlert('승인완료 또는 결제 승인 TID/Key가 있는 계좌는 삭제할 수 없습니다. 숨김 처리가 필요한 경우 상세 화면의 숨김 버튼을 사용해 주세요.');
    return;
  }
  const removed=editingAgencies.splice(idx,1)[0];
  queueRemovedAgencyAccount(removed);
  renumberDAProofDisplayNames();
  renderDARows(false);
}
function normalizedDABankName(account){
  const bankName=String(account?.bankName||'').trim();
  const agencyName=String(account?.agency||account?.agencyName||'').trim();
  return bankName&&bankName!==agencyName?bankName:'';
}
async function hideRemovedAgencyAccounts(){
  const targets=removedEditingAgencies.filter(item=>item.source==='account_request'&&item.id);
  for(const target of targets){
    const res=await fetch(`/api/admin/accounts/${encodeURIComponent(target.id)}?source=${encodeURIComponent(target.source)}`,{
      method:'DELETE',
      headers:adminAuthHeaders()
    });
    if(await handleAdminUnauthorized(res))return false;
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.error?.message||err.message||'삭제한 계좌 숨김 처리에 실패했습니다.');
    }
  }
  removedEditingAgencies=[];
  return true;
}
function adminSafeFileBaseName(value,fallback='가맹점'){
  return String(value||fallback).trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_')||fallback;
}
function adminUploadExt(file){
  const name=String(file?.name||'');
  const match=name.match(/(\.[^.]+)$/);
  return match?match[1].toLowerCase():'';
}
function daProofDisplayNameByNo(file,no,franchiseName=''){
  const base=`${adminSafeFileBaseName(franchiseName||v('fn'),'가맹점')}_포스사진`;
  return `${base}${String(no).padStart(2,'0')}${adminUploadExt(file)}`;
}
function daProofNumberFromName(name){
  const match=String(name||'').match(/_포스사진(\d{2,})(?:\.[^.]+)?$/);
  return match?Number(match[1])||0:0;
}
function initDAProofPickOrders(franchiseName=''){
  daProofPickSeq=0;
  editingAgencies.forEach((a,i)=>{
    if(a.fileName||a.fileKey){
      const order=daProofNumberFromName(a.fileName)||i+1;
      a.proofPickOrder=order;
      daProofPickSeq=Math.max(daProofPickSeq,order);
    }
  });
  renumberDAProofDisplayNames(franchiseName);
}
function renumberDAProofDisplayNames(franchiseName=''){
  const items=editingAgencies
    .map((a,i)=>({a,i}))
    .filter(item=>item.a.proofFile||item.a.fileName||item.a.fileKey)
    .sort((left,right)=>(Number(left.a.proofPickOrder||left.i+1)-Number(right.a.proofPickOrder||right.i+1))||left.i-right.i);
  items.forEach((item,index)=>{
    const a=item.a;
    const no=index+1;
    if(a.proofFile)a.fileName=daProofDisplayNameByNo(a.proofFile,no,franchiseName);
    else if(a.fileName){
      const ext=(String(a.fileName).match(/(\.[^.]+)$/)||[''])[0];
      a.fileName=`${adminSafeFileBaseName(franchiseName||v('fn'),'가맹점')}_포스사진${String(no).padStart(2,'0')}${ext}`;
    }
  });
}
async function uploadDAProofFile(file,franchiseName,displayName){
  const fd=new FormData();
  fd.append('file',file);
  fd.append('franchiseName',franchiseName||v('fn')||'');
  fd.append('displayName',displayName||'');
  const res=await fetch('/api/admin/uploads/account-proof',{method:'POST',headers:adminAuthHeaders(),body:fd});
  if(await handleAdminUnauthorized(res))throw new Error('로그인이 필요합니다.');
  const json=await res.json().catch(()=>({}));
  if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'계좌 증빙 파일 업로드에 실패했습니다.');
  return json.data||{};
}
function setDAProofFile(idx,input){
  const file=input?.files?.[0];
  if(!file)return;
  if(!/^image\//i.test(file.type||'')&&file.type!=='application/pdf'&&!/\.(png|jpe?g|gif|webp|pdf)$/i.test(file.name||'')){
    toast('증빙은 이미지 또는 PDF만 가능합니다');
    input.value='';
    return;
  }
  editingAgencies[idx].proofFile=file;
  editingAgencies[idx].fileKey='';
  if(!editingAgencies[idx].proofPickOrder){
    daProofPickSeq+=1;
    editingAgencies[idx].proofPickOrder=daProofPickSeq;
  }
  renumberDAProofDisplayNames();
  renderDARows(false);
}

function agencyDisplayOptions(selectedId,selectedName,typeFilter=''){
  const agencies=Array.isArray(D.agencies)?D.agencies:[];

  const selected=String(selectedId||'');
  const filtered=franchiseAgencyOptionItems(typeFilter);
  const selectedByName=!selected&&selectedName?filtered.find(a=>a.name===selectedName):null;
  return filtered.map((a,idx)=>{
    const isSelected=String(a.id)===selected||(!selected&&selectedByName?String(a.id)===String(selectedByName.id):!selected&&!selectedName&&idx===0);
    return `<option value="${esc(a.id)}" ${isSelected?'selected':''}>${esc(agencyTypeLabel(a))}  ${esc(a.name)}</option>`;
  }).join('')||`<option value="">선택 가능한 ${agencyTypeLabel(typeFilter)} 대리점 없음</option>`;

function loadAdminPostcodeScript(){
  if(window.daum?.Postcode)return Promise.resolve();
  if(window.__adminPostcodePromise)return window.__adminPostcodePromise;
  window.__adminPostcodePromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
    script.async=true;
    script.onload=resolve;
    script.onerror=()=>reject(new Error('주소검색 스크립트를 불러오지 못했습니다.'));
    document.head.appendChild(script);
  });
  return window.__adminPostcodePromise;
}

function deliveryAccountPgPayload(account,providerName){
  if(providerName==='위루트'){
    const c=routeupContractDraft(account);
    const hasRawRouteupContract=Boolean(c.tid||c.paymentKey||c.signatureKey||c.apiKey||c.encryptionKey||c.initializationVector);
    if(!hasRawRouteupContract)return{txid:account.txid||'',pgContracts:[]};
    const routeupMetadata={};
    if(c.apiKey)routeupMetadata.routeupApiKey=c.apiKey;
    if(c.encryptionKey)routeupMetadata.routeupEncryptionKey=c.encryptionKey;
    if(c.initializationVector)routeupMetadata.initializationVector=c.initializationVector;
    return{
      txid:c.tid||'',
      manualTid:'',
      manualKey:'',
      recurringTid:'',
      recurringKey:'',
      pgContracts:[{
        providerId:c.providerId||selectedFranchisePgProviderId(),
        providerName:'위루트',
        credentialType:'routeup',
        mid:c.mid||routeupDefaultMid(),
        tid:c.tid||'',
        paymentKey:c.paymentKey||'',
        signatureKey:c.signatureKey||'',
        apiKey:c.apiKey||'',
        encryptionKey:c.encryptionKey||'',
        initializationVector:c.initializationVector||'',
        metadata:routeupMetadata,
        isDefault:true
      }]
    };
  }
  const c=ghContractDraft(account);
  return{
    txid:c.recurringTid||c.manualTid||account.txid||'',
    recurringTid:c.recurringTid||'',
    recurringKey:c.recurringKey||'',
    manualTid:c.manualTid||'',
    manualKey:c.manualKey||'',
    pgContracts:[]
  };
}
function hasDeliveryAccountPgPayload(pgPayload={}){
  return Boolean(
    pgPayload.txid||
    pgPayload.manualTid||
    pgPayload.manualKey||
    pgPayload.recurringTid||
    pgPayload.recurringKey||
    (Array.isArray(pgPayload.pgContracts)&&pgPayload.pgContracts.length)
  );
}
function accountRequestPgContractUpdates(providerName){
  return editingAgencies
    .filter(account=>account.source==='account_request'||String(account.requestId||'').trim())
    .map(account=>{
      syncRouteupAccountApprovalStatus(account,providerName);
      const accountId=String(account.requestId||account.id||account.accountId||'').trim();
      if(!accountId)return null;
      const pgPayload=deliveryAccountPgPayload(account,providerName);
      if(!hasDeliveryAccountPgPayload(pgPayload))return null;
      return {accountId,providerName,pgPayload};
    })
    .filter(Boolean);
}
async function saveAccountRequestPgContracts(updates=[],franchiseId=''){
  for(const update of updates){
    const body={
      source:'account_request',
      accountId:update.accountId,
      franchiseId,
      providerName:update.providerName,
      manualTid:update.pgPayload.manualTid||'',
      manualKey:update.pgPayload.manualKey||'',
      recurringTid:update.pgPayload.recurringTid||update.pgPayload.txid||'',
      recurringKey:update.pgPayload.recurringKey||'',
      contracts:update.pgPayload.pgContracts||[]
    };
    const res=await fetch('/api/admin/accounts/pg-contracts',{
      method:'PUT',
      headers:adminAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify(body)
    });
    const json=await res.json().catch(()=>({}));
    if(await handleAdminUnauthorized(res))return false;
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'요청 계좌 PG 계약정보 저장에 실패했습니다.');
  }
  return true;
}

async function exportApprovedAccounts(format=''){

    if(accountExportPendingCount(provider)<=0){
      const providerLabel=provider==='위루트'?'위루트':(provider==='GH Payments'?'건흥':'');

async function saveAccountPgContract(fid,idx){
  if(role!=='hq'){await adminAlert('권한이 없습니다.');return;}
  const found=getManagedAccount(fid,idx);
  if(!found){await adminAlert('계좌 정보를 찾지 못했습니다. 새로고침 후 다시 시도해주세요.');return;}
  const ident=getManagedAccountIdentity(found.account);

  const providerName=accountPgProviderName(v('pgc-provider'));
  const body={source:ident.source,accountId:String(ident.id),providerName,contracts:[]};
  if(providerName==='위루트'){
    const previousRouteup=routeupAccountContract(found.account);
    const metadata={};
    const apiKey=v('pgc-routeup-api-key');
    const encryptionKey=v('pgc-routeup-encryption-key');
    const initializationVector=v('pgc-routeup-iv');
    if(apiKey)metadata.routeupApiKey=apiKey;
    if(encryptionKey)metadata.routeupEncryptionKey=encryptionKey;
    if(initializationVector)metadata.initializationVector=initializationVector;
    const contract={
      providerName:'위루트',
      mid:v('pgc-routeup-mid'),
      tid:v('pgc-routeup-tid'),
      paymentKey:v('pgc-routeup-payment-key')||previousRouteup.paymentKey||'',
      signatureKey:previousRouteup.signatureKey||'',
      apiKey,
      encryptionKey,
      initializationVector,
      metadata,
      isDefault:true
    };
    if(!contract.mid||!contract.tid||!contract.paymentKey){
      await adminAlert('위루트 MID, TID, 결제 KEY는 필수입니다.');
      return;
    }
    body.contracts=[contract];
  }else{
    body.recurringTid=v('pgc-recurring-tid');
    body.recurringKey=v('pgc-recurring-key')||found.account.recurringKey||'';
    body.manualTid=v('pgc-manual-tid');
    body.manualKey=v('pgc-manual-key')||found.account.manualKey||'';
    if(!body.recurringTid||!body.recurringKey){
      await adminAlert('건흥 정기 TID와 정기 Key는 필수입니다.');
      return;
    }
  }
  try{
    const res=await fetch('/api/admin/accounts/pg-contracts',{method:'PUT',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    const payload=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(payload.error?.message||payload.message||'PG 계약정보 저장에 실패했습니다.');
    await syncBackendTransactions();
    closeM();
    renderPage();
    toast('PG 계약정보가 저장되었습니다.');
  }catch(e){
    await adminAlert(e.message||'PG 계약정보 저장에 실패했습니다.');
  }
}

function agencySubtreeIds(id){

  walk(id);

function agencyChain(a){
  const chain=[];let cur=a,guard=0;
  while(cur&&guard<20){chain.unshift(cur);cur=(D.agencies||[]).find(x=>String(x.id)===String(cur.parentId||''));guard+=1;}
  return chain;

function agencyTreeRows(){
  const all=[...(D.agencies||[])];
  const byParent=new Map();
  const byId=new Map(all.map(a=>[String(a.id),a]));
  all.forEach(a=>{
    const parentId=String(a.parentId||'');
    if(!byParent.has(parentId))byParent.set(parentId,[]);
    byParent.get(parentId).push(a);
  });
  const sortNodes=nodes=>nodes.sort((a,b)=>{
    const rankA=agencyTypeRank(a);
    const rankB=agencyTypeRank(b);
    if(rankA!==rankB)return rankA-rankB;
    return String(a.name||a.id).localeCompare(String(b.name||b.id),'ko')||String(a.id).localeCompare(String(b.id));
  });
  byParent.forEach(sortNodes);
  const roots=sortNodes(all.filter(a=>!a.parentId||!byId.has(String(a.parentId))||agencyTypeKey(a)==='hq'));
  const rows=[],seen=new Set();
  const walk=node=>{
    const id=String(node.id);
    if(seen.has(id))return;
    seen.add(id);
    rows.push(node);
    (byParent.get(id)||[]).forEach(walk);
  };
  roots.forEach(walk);
  all.filter(a=>!seen.has(String(a.id))).sort((a,b)=>agencySortKey(a).localeCompare(agencySortKey(b))).forEach(walk);
  return rows;
}
function agencyTreeRowsWithFranchises(){
  const all=[...(D.agencies||[])];
  const byParent=new Map();
  const byId=new Map(all.map(a=>[String(a.id),a]));
  const mainHq=all.find(a=>agencyTypeKey(a)==='hq')||null;
  all.forEach(a=>{
    const rawParentId=String(a.parentId||'');
    const parentId=rawParentId&&byId.has(rawParentId)
      ?rawParentId
      :(mainHq&&agencyTypeKey(a)!=='hq'?String(mainHq.id):'');
    if(!byParent.has(parentId))byParent.set(parentId,[]);
    byParent.get(parentId).push(a);
  });
  const sortNodes=nodes=>nodes.sort((a,b)=>{
    const rankA=agencyTypeRank(a);
    const rankB=agencyTypeRank(b);
    if(rankA!==rankB)return rankA-rankB;
    return String(a.name||a.id).localeCompare(String(b.name||b.id),'ko')||String(a.id).localeCompare(String(b.id));
  });
  byParent.forEach(sortNodes);
  const roots=sortNodes(mainHq?[mainHq]:all.filter(a=>!a.parentId||!byId.has(String(a.parentId))));
  const rows=[],seen=new Set();
  const pushFranchises=a=>{
    const list=agencyFranchises(a.id,false)
      .sort((x,y)=>String(x.name||x.id).localeCompare(String(y.name||y.id),'ko'));
    const parentDepth=agencyVisualDepth(a);
    list
      .forEach((f,idx)=>rows.push({
        ...f,
        _nodeType:'franchise',
        _treeParentDepth:parentDepth,
        _treeSiblingIndex:idx,
        _treeSiblingCount:list.length,
        _treeLastSibling:idx===list.length-1,
        parentId:a.id,
        parentName:a.name,
        type:'FRANCHISE',
        level:Number(a.level||1)+1
      }));
  };
  const walk=a=>{
    const id=String(a.id);
    if(seen.has(id))return;
    seen.add(id);
    rows.push({...a,_nodeType:'agency'});
    (byParent.get(id)||[]).forEach(walk);
    pushFranchises(a);
  };
  roots.forEach(walk);
  all.filter(a=>!seen.has(String(a.id))).sort((a,b)=>agencySortKey(a).localeCompare(agencySortKey(b))).forEach(walk);
  return rows;
}

    const rowRect=row.getBoundingClientRect();
    const cellRect=cell.getBoundingClientRect();
    const labelRect=label.getBoundingClientRect();
    const labelPadLeft=parseFloat(getComputedStyle(label).paddingLeft)||0;
    const labelX=labelRect.left-wrapRect.left+wrap.scrollLeft;
    const labelTextX=labelX+labelPadLeft;
    const y=rowRect.top-wrapRect.top+wrap.scrollTop+(rowRect.height/2);
    const rowBottom=rowRect.bottom-wrapRect.top+wrap.scrollTop;
    return {
      row,
      label,
      type:row.dataset.treeNode||'',
      id:row.dataset.treeId||'',
      parentId:row.dataset.treeParentId||'',
      typeKey:row.dataset.treeType||'',
      depth:Number(row.dataset.treeDepth||0),
      cellX:cellRect.left-wrapRect.left+wrap.scrollLeft,
      labelX,
      labelTextX,
      labelStop:Math.max(labelX-12,0),
      y,
      rowBottom
    };
  }).filter(Boolean);
  svg.setAttribute('width',Math.max(table.scrollWidth,wrap.clientWidth));
  svg.setAttribute('height',Math.max(table.offsetHeight,wrap.clientHeight));
  svg.setAttribute('viewBox',`0 0 ${Math.max(table.scrollWidth,wrap.clientWidth)} ${Math.max(table.offsetHeight,wrap.clientHeight)}`);
  const agencyRows=rows.filter(r=>r.type==='agency');
  const franchiseRows=rows.filter(r=>r.type==='franchise');
  const byAgencyId=new Map(agencyRows.map(r=>[r.id,r]));
  const paths=[];
  const nodes=[];
  const path=(d,cls='')=>{
    paths.push(`<path class="admin-agency-network-path ${cls}" d="${d}"></path>`);
  };
  const node=(x,y,cls='')=>nodes.push(`<circle class="admin-agency-network-node ${cls}" cx="${Math.round(x)}" cy="${Math.round(y)}" r="2.6"></circle>`);
  const move=(x,y)=>`M ${Math.round(x)} ${Math.round(y)}`;
  const line=(x,y)=>`L ${Math.round(x)} ${Math.round(y)}`;
  const tickLen=30;
  const labelGap=6;
  const labelPad=4;
  const nodeOffset=tickLen+labelGap-labelPad;
  const typeColumnGap=42;
  const tickEnd=x=>x+tickLen;
  const textStart=x=>x+tickLen+labelGap;
  const rankByType={hq:0,bonbu:1,jisa:2,jijum:3};
  const typeRank=row=>Number.isFinite(rankByType[row.typeKey])?rankByType[row.typeKey]:Math.max(Number(row.depth)||0,0);
  const applyLabelLeft=(row,left)=>{
    const next=Math.round(left-row.cellX);
    if(Math.abs(Number(row.label.dataset.treeMarginLeft||-9999)-next)>1){
      row.label.dataset.treeMarginLeft=String(next);
      row.label.style.marginLeft=`${next}px`;
      return true;
    }
    return false;
  };
  let relayout=false;
  const rootRows=agencyRows.filter(row=>row.depth<=0);
  const rootX=(rootRows[0]?.cellX||agencyRows[0]?.cellX||0)+18;
  agencyRows.forEach(row=>{
    const parent=byAgencyId.get(String(row.parentId));
    const isDirectChild=parent&&!parent.parentId;
    if(!parent)row.legX=rootX;
    else if(isDirectChild)row.legX=rootX+(typeRank(row)*typeColumnGap);
    else row.legX=parent.textX||textStart(parent.legX);
    row.textX=textStart(row.legX);
  });
  agencyRows.forEach(row=>{
    const parent=byAgencyId.get(String(row.parentId));
    if(parent&&row.depth>0){
      if(!parent.parentId)row.legX=rootX+(typeRank(row)*typeColumnGap);
      else row.legX=parent.textX;
      row.textX=textStart(row.legX);
      relayout=applyLabelLeft(row,row.textX-labelPad)||relayout;
    }
  });
  const agencyDescendantsOf=parent=>agencyRows.filter(row=>{
    let current=row,guard=0;
    while(current?.parentId&&guard<12){
      if(String(current.parentId)===String(parent.id))return true;
      current=byAgencyId.get(String(current.parentId));
      guard+=1;
    }
    return false;
  });
  agencyRows.forEach(parent=>{
    const childAgencies=agencyRows.filter(r=>r.parentId&&String(r.parentId)===String(parent.id));
    const franchiseGroup=franchiseRows.filter(r=>String(r.parentId)===String(parent.id));
    const anchors=[
      ...childAgencies.map(r=>({y:r.y})),
      ...(franchiseGroup.length?[{y:franchiseGroup[0].y}]:[])
    ].sort((a,b)=>a.y-b.y);
    if(anchors.length){
      const firstY=parent.depth<=0?Math.min(parent.rowBottom,anchors[0].y):Math.min(parent.y,anchors[0].y);
      const lastY=Math.max(parent.y,anchors[anchors.length-1].y);
      path(`${move(parent.legX,firstY)} ${line(parent.legX,lastY)}`,'admin-agency-network-root-leg');
      anchors.forEach(anchor=>node(parent.legX,anchor.y,'admin-agency-network-node-root'));
    }
  });
  agencyRows.filter(row=>row.depth>0).forEach(row=>{
    const parent=byAgencyId.get(String(row.parentId));
    if(!parent)return;
    if(parent.legX!==row.legX)path(`${move(parent.legX,row.y)} ${line(row.legX,row.y)}`,'admin-agency-network-connector');
    path(`${move(row.legX,row.y)} ${line(tickEnd(row.legX),row.y)}`,'admin-agency-network-tick');
    node(row.legX,row.y,'admin-agency-network-node-child');
  });
  agencyRows.forEach(parent=>{
    const group=franchiseRows.filter(r=>String(r.parentId)===String(parent.id));
    if(!group.length)return;
    const deepestAgency=agencyDescendantsOf(parent).sort((a,b)=>b.depth-a.depth||b.labelX-a.labelX)[0];
    const groupX=deepestAgency?deepestAgency.textX:(parent.textX||textStart(parent.legX));
    group.forEach(row=>{relayout=applyLabelLeft(row,textStart(groupX)-labelPad)||relayout;});
    const firstY=group[0].y;
    const lastY=group[group.length-1].y;
    path(`${move(parent.legX,firstY)} ${line(groupX,firstY)}`,'admin-agency-network-connector');
    if(group.length>1)path(`${move(groupX,firstY)} ${line(groupX,lastY)}`,'admin-agency-network-group-leg');
    group.forEach(row=>{
      path(`${move(groupX,row.y)} ${line(tickEnd(groupX),row.y)}`,'admin-agency-network-tick');
      node(groupX,row.y,'admin-agency-network-node-group');
    });
  });
  if(relayout){
    requestAnimationFrame(drawAgencyTreeNetwork);
    return;
  }
  svg.innerHTML=paths.join('')+nodes.join('');
}
function formatAgencyListDate(value){
  const raw=String(value||'').trim();
  return raw?dateOnly(raw):'-';
}
function agencyJoinDate(agency){
  return esc(formatAgencyListDate(agency?.joinDate||agency?.createdAt||agency?.created_at));
}
function agencyLatestPaymentDate(agency){
  const agencyIds=new Set(agencySubtreeIds(agency?.id).map(String));
  if(!agencyIds.size)return'<span class="admin-empty-muted">-</span>';
  const franchiseIds=new Set((D.franchises||[])
    .filter(f=>agencyIds.has(String(f.agencyId||'')))
    .map(f=>String(f.id)));
  const franchiseDates=(D.franchises||[])
    .filter(f=>franchiseIds.has(String(f.id)))
    .map(f=>formatAgencyListDate(f.lastPaymentDate||f.lastPaymentAt||f.recentPaymentDate))
    .filter(date=>date&&date!=='-');
  const paymentDates=(D.payments||[])
    .filter(p=>agencyIds.has(paymentAgencyId(p))||franchiseIds.has(String(p.franchiseId||''))||franchiseIds.has(String(paymentFranchise(p)?.id||'')))
    .map(p=>formatAgencyListDate(p.date||p.approvedAt||p.createdAt||p.created_at))
    .filter(date=>date&&date!=='-');
  const latest=[...franchiseDates,...paymentDates].sort().pop();
  return latest?esc(latest):'<span class="admin-empty-muted">-</span>';
}

function agencyParentCandidates(a={},typeFilter=agencyParentTypeFilter){
  const current=String(a.id||'');
  const blocked=current?agencySubtreeIds(current):[];
  return (D.agencies||[])
    .filter(x=>!current||!blocked.includes(String(x.id)))
    .filter(x=>!typeFilter||agencyTypeKey(x)===typeFilter)
    .sort((x,y)=>agencyTypeRank(x)-agencyTypeRank(y)||agencySortKey(x).localeCompare(agencySortKey(y),'ko'));
}
function selectedAgencyParentItem(selectedId,selectedName,a={},typeFilter=agencyParentTypeFilter){
  const selected=String(selectedId||'');
  const items=agencyParentCandidates(a,typeFilter);
  return (selected?items.find(x=>String(x.id)===selected):null)
    ||(selectedName?items.find(x=>x.name===selectedName):null)
    ||null;
}
function agencyParentDisplayOptions(a={},selectedId=a.parentId,selectedName=''){
  const selected=String(selectedId||'');
  const items=agencyParentCandidates(a,agencyParentTypeFilter);
  const selectedByName=!selected&&selectedName?items.find(x=>x.name===selectedName):null;
  const opts=items.map(x=>{
    const isSelected=String(x.id)===selected||(!selected&&selectedByName&&String(x.id)===String(selectedByName.id));
    return `<option value="${esc(x.id)}" ${isSelected?'selected':''}>${esc(agencyTypeLabel(x))} ${esc(x.name)}</option>`;
  }).join('');
  return `<option value="" ${!selected&&!selectedByName?'selected':''}>상위 없음</option>${opts}`;
}
function agencyParentOptions(a={}){
  return agencyParentDisplayOptions(a,a.parentId,agencyParentName(a));
}

function markAgencySettleAccountFields(){
  const ids=['asb','asa','ash'];
  const missing=ids.filter(id=>!v(id).trim());
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    const isMissing=missing.includes(id);
    el.classList.toggle('admin-field-invalid',isMissing);
    if(isMissing)el.setAttribute('aria-invalid','true');
    else el.removeAttribute('aria-invalid');
  });
  const warning=document.getElementById('agency-settle-warning');
  if(warning)warning.classList.toggle('is-visible',!!missing.length);
  if(missing.length)document.getElementById(missing[0])?.focus();
}
async function saveAgencySettleAccount(agencyId){
  const bankName=v('asb').trim();
  const accountNo=v('asa').trim();
  const accountHolder=v('ash').trim();
  if(!bankName&&!accountNo&&!accountHolder)return false;
  if(!bankName||!accountNo||!accountHolder){
    markAgencySettleAccountFields();
    throw new Error('정산 계좌는 은행, 계좌번호, 예금주를 모두 입력해야 저장됩니다.');
  }
  const fd=new FormData();
  fd.append('bankName',bankName);
  fd.append('accountNo',accountNo);
  fd.append('accountHolder',accountHolder);
  const res=await fetch(`/api/agency/${encodeURIComponent(agencyId)}/settle-account`,{method:'POST',headers:adminAuthHeaders(),body:fd});
  if(await handleAdminUnauthorized(res))return null;
  const json=await res.json().catch(()=>({}));
  if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'정산 계좌 저장에 실패했습니다.');

async function delAg(id){
  const a=D.agencies.find(x=>String(x.id)===String(id));

  const childCount=(D.agencies||[]).filter(x=>String(x.parentId||'')===String(id)).length;
  const franchiseCount=(D.franchises||[]).filter(x=>String(x.agencyId||'')===String(id)||x.agency===a.name).length;
  let msg=`'${a.name}' 대리점을 삭제하시겠습니까?`;
  if(childCount||franchiseCount){
    msg+=`\n하위 대리점 ${childCount}개, 연결 가맹점 ${franchiseCount}개는 대리점 연결이 해제됩니다.`;
  }
  msg+='\n이 작업은 되돌릴 수 없습니다.';
  if(!await adminConfirm(msg,'대리점 삭제'))return;
  try{
    const res=await fetch(`/api/admin/agencies/${encodeURIComponent(id)}`,{method:'DELETE',headers:adminAuthHeaders()});
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      const code=err.error?.code?` [${err.error.code}]`:'';
      throw new Error((err.error?.message||err.message||'대리점 삭제에 실패했습니다.')+code);
    }
    if(String(agDetailId||'')===String(id)){page='agencies';agDetailId=null;renderNav();}
    await syncBackendTransactions({forceRender:true});
    toast('대리점이 삭제되었습니다.');

    console.error(e);
    await adminAlert(e.message||'대리점 삭제에 실패했습니다.');
  }
}

function sortedDeliveryAgencyList(){
  const cur=daSortState();
  const getVal=(a)=>{
    if(cur.key==='logo')return a.logoUrl?'1':'0';
    if(cur.key==='name')return a.name||'';
    if(cur.key==='corp')return a.corporationName||'';
    if(cur.key==='bizno')return a.businessNumber||'';

    if(cur.key==='file')return deliveryAgencyBusinessDisplayName(a);
    if(cur.key==='delete')return Number(a.id)||0;
    return Number(a.sortOrder||0);
  };
  return getAllDA().slice().sort((a,b)=>{
    const av=getVal(a),bv=getVal(b);
    let cmp=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'ko');

    return cur.dir==='desc'?-cmp:cmp;
  });
}

async function saveDADetail(id){
  const a=D.deliveryAgencyList.find(x=>String(x.id)===String(id));

  const dup=D.deliveryAgencyList.find(x=>String(x.id)!==String(id)&&String(x.name||'').trim()===name&&x.status!=='deleted');
  if(dup){await adminAlert('이미 존재하는 배달대행사 이름입니다.');return;}
  try{
    const payload={
      name,
      logoUrl:document.getElementById('da-detail-logo-url')?.value?.trim()||'',
      corporationName:document.getElementById('da-detail-corp')?.value?.trim()||'',
      businessNumber:document.getElementById('da-detail-bizno')?.value?.trim()||'',
      status:document.getElementById('da-detail-status')?.value||'active',
      sortOrder:a.sortOrder||0
    };
    const res=await fetch(`/api/admin/delivery-agencies/${encodeURIComponent(id)}`,{method:'PUT',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify(payload)});
    if(await handleAdminUnauthorized(res))return;
    const json=await res.json().catch(()=>({}));
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'배달대행사 정보 저장에 실패했습니다.');
    const file=document.getElementById('da-detail-bizfile')?.files?.[0];
    if(file)await uploadDeliveryAgencyBusinessFile(id,file,{silent:true});

    await syncBackendTransactions();renderPage();toast('배달대행사 정보가 저장되었습니다.');
  }catch(e){await adminAlert(e.message||'배달대행사 정보 저장에 실패했습니다.');}
}

async function uploadDeliveryAgencyBusinessFile(id,file=null,opts={}){
  const a=D.deliveryAgencyList.find(x=>String(x.id)===String(id));
  if(!a){await adminAlert('배달대행사를 찾을 수 없습니다.');return;}
  const selected=file||await new Promise(resolve=>{
    const input=document.createElement('input');
    input.type='file';input.accept='image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.gif,.webp';
    input.addEventListener('change',()=>resolve(input.files?.[0]||null),{once:true});
    input.click();
  });
  if(!selected)return;
  if(!/^image\//i.test(selected.type||'')&&selected.type!=='application/pdf'&&!/\.(png|jpe?g|gif|webp|pdf)$/i.test(selected.name||'')){await adminAlert('사업자등록증은 PDF 또는 이미지 파일만 등록할 수 있습니다.');return;}
  try{
    const fd=new FormData();fd.append('file',selected);
    const res=await fetch(`/api/admin/delivery-agencies/${encodeURIComponent(id)}/business-file`,{method:'POST',headers:adminAuthHeaders(),body:fd});
    if(await handleAdminUnauthorized(res))return;
    const json=await res.json().catch(()=>({}));
    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'사업자등록증 업로드에 실패했습니다.');
    const fresh=D.deliveryAgencyList.find(x=>String(x.id)===String(id));
    if(fresh){
      fresh.businessFileKey=json.data?.businessFile||fresh.businessFileKey||'';
      fresh.businessFileName=json.data?.businessFileName||deliveryAgencyBusinessDisplayName(fresh);
    }
    if(!opts.silent){await syncBackendTransactions();renderPage();toast('사업자등록증이 등록되었습니다.');}
  }catch(e){await adminAlert(e.message||'사업자등록증 업로드에 실패했습니다.');}
}

  <label class="ci admin-strong-green"><input type="checkbox" id="ld-applied"> 저장 즉시 앱에 적용</label>`;}
function normalizeLegalDocText(fileName,text){
  const ext=String(fileName||'').split('.').pop().toLowerCase();
  const normalizeMarkdown=value=>String(value||'')
    .replace(/\r\n/g,'\n')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/^#{1,6}\s*/gm,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/gm,'')
    .replace(/^\s*\|(.+)\|\s*$/gm,(match,row)=>row.split('|').map(cell=>cell.trim()).filter(Boolean).join('  '))
    .replace(/^\s*\|\s*/gm,'')
    .replace(/\s*\|\s*$/gm,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
  if(ext==='html'||ext==='htm'){
    const doc=new DOMParser().parseFromString(text,'text/html');
    return (doc.body?.innerText||text).trim();
  }
  if(ext==='rtf'){
    return text
      .replace(/\\par[d]?/g,'\n')
      .replace(/\\'[0-9a-fA-F]{2}/g,'')
      .replace(/\\[a-zA-Z]+-?\d* ?/g,'')
      .replace(/[{}]/g,'')
      .replace(/\n{3,}/g,'\n\n')
      .trim();
  }
  if(ext==='md'||ext==='markdown')return normalizeMarkdown(text);
  return String(text||'').replace(/<br\s*\/?>/gi,'\n').trim();
}
async function readLegalDocFile(file){
  const name=String(file?.name||'');
  const ext=name.split('.').pop().toLowerCase();
  const supported=['txt','md','markdown','html','htm','rtf'];
  const blocked=['pdf','doc','docx','hwp','hwpx'];
  if(blocked.includes(ext)){
    throw new Error(`${name} 파일은 자동으로 본문을 추출할 수 없습니다.\n파일을 열어서 내용을 복사한 뒤 본문 칸에 붙여넣어 주세요.`);
  }
  if(ext&&!supported.includes(ext)){
    throw new Error('지원하지 않는 파일 형식입니다. txt, md, html, rtf 파일만 불러올 수 있습니다.');
  }
  if(file.size>8*1024*1024){
    throw new Error('파일 용량이 너무 큽니다. 8MB 이하의 md/txt 파일로 나누어 등록해 주세요.');
  }
  const raw=await file.text();
  const text=normalizeLegalDocText(name,raw);
  if(!text)throw new Error('파일에서 읽을 수 있는 본문이 없습니다. 내용을 직접 입력해 주세요.');
  return text;
}

function upsertLegalDocLocal(doc){
  if(!doc||!doc.id)return;
  D.legalDocuments=Array.isArray(D.legalDocuments)?D.legalDocuments:[];
  if(doc.applied){
    D.legalDocuments=D.legalDocuments.map(item=>String(item.type)===String(doc.type)?{...item,applied:false,appliedAt:null}:item);
  }
  const idx=D.legalDocuments.findIndex(item=>String(item.id)===String(doc.id));
  if(idx>=0)D.legalDocuments[idx]={...D.legalDocuments[idx],...doc};
  else D.legalDocuments.unshift(doc);
}

  if(!title||!content){await adminAlert('제목과 본문을 입력하세요.');return;}
  const marker=`${title}\n${sourceFileName}`.toLowerCase();
  if(type==='terms'&&(marker.includes('개인정보')||marker.includes('privacy'))){
    await adminAlert('개인정보처리방침 파일은 왼쪽 개인정보처리방침 영역의 [+ 새 문서 등록]에서 등록해 주세요.');

  if(type==='privacy'&&(marker.includes('이용약관')||marker.includes('서비스약관')||marker.includes('terms'))&&!marker.includes('개인정보')){

  try{

    const json=await res.json().catch(()=>({}));

    if(!res.ok||!json.success)throw new Error(json.error?.message||json.message||'문서 저장에 실패했습니다.');

  }catch(e){await adminAlert(e.message||'문서 저장에 실패했습니다.');}

document.addEventListener('keydown',ev=>{
  const input=ev.target?.closest?.('#avicx-command-input');
  if(!input)return;
  const hasCompletions=avicxHasVisibleCompletions();
  if(ev.key==='Enter'){
    ev.preventDefault();
    ev.stopPropagation();
    if(hasCompletions&&avicxAcceptCompletion(input))return;
    avicxHideCompletions();
    const command=input.value||'';
    input.value='';
    avicxExecute(command);
    return;
  }
  if(ev.key==='Tab'){
    ev.preventDefault();
    ev.stopPropagation();
    avicxApplyCompletion(input,ev.shiftKey);
    return;
  }
  if(ev.key==='Escape'){
    avicxHideCompletions();
    return;
  }
  if(ev.key==='ArrowUp'){
    ev.preventDefault();
    if(hasCompletions){avicxMoveCompletion(-1);return;}
    avicxHistoryIndex=Math.max(0,avicxHistoryIndex-1);
    input.value=avicxHistory[avicxHistoryIndex]||input.value;
    avicxHideCompletions();
  }
  if(ev.key==='ArrowDown'){
    ev.preventDefault();
    if(hasCompletions){avicxMoveCompletion(1);return;}
    avicxHistoryIndex=Math.min(avicxHistory.length,avicxHistoryIndex+1);
    input.value=avicxHistory[avicxHistoryIndex]||'';
    avicxHideCompletions();
  }
});

document.addEventListener('input',ev=>{
  const input=ev.target?.closest?.('#avicx-command-input');
  if(!input)return;
  const matches=avicxCompletionMatches(input.value||'');
  avicxAutocompleteState={prefix:'',matches:[],index:0};
  avicxRenderCompletions(matches,0);
});

},true);

document.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='touch'&&ev.target.closest?.('[data-proof-zoom-stage]')){
    proofTouchPointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(proofTouchPointers.size===1)startProofLongPress(ev);
    if(proofTouchPointers.size>=2){cancelProofLongPress();proofTouchGestureLocked=true;cancelProofActiveTouchGesture();updateProofPinchZoom();}
  }
  if(ev.target.closest?.('[data-da-logo-crop-pan]'))startDeliveryAgencyLogoCropPan(ev);
  if(ev.pointerType==='touch'&&proofTouchGestureLocked)return;
  if(ev.target.closest?.('[data-proof-zoom-image]')&&beginProofOcrSelection(ev))return;
  if(ev.target.closest?.('[data-proof-zoom-pan]'))startProofImagePan(ev);
});
document.addEventListener('pointermove',ev=>{
  const proofTouch=proofTouchPointers.has(ev.pointerId);
  if(proofTouch){
    proofTouchPointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(proofLongPressState&&Math.hypot(ev.clientX-proofLongPressState.x,ev.clientY-proofLongPressState.y)>10)cancelProofLongPress();
    if(proofTouchGestureLocked)updateProofPinchZoom();
  }
  moveProofOcrSelection(ev);
  moveDeliveryAgencyLogoCropPan(ev);
  if(!(proofTouch&&proofTouchGestureLocked))moveProofImagePan(ev);
});
document.addEventListener('pointerup',ev=>{
  if(proofTouchPointers.delete(ev.pointerId)){if(proofLongPressState?.pointerId===ev.pointerId)cancelProofLongPress();if(proofTouchPointers.size===0){proofTouchGestureLocked=false;proofPinchState=null;}else updateProofPinchZoom();}
  endProofOcrSelection(ev);
  endDeliveryAgencyLogoCropPan(ev);
  endProofImagePan(ev);
});
document.addEventListener('pointercancel',ev=>{
  if(proofTouchPointers.delete(ev.pointerId)){cancelProofLongPress();if(proofTouchPointers.size===0){proofTouchGestureLocked=false;proofPinchState=null;}else updateProofPinchZoom();}
  endProofOcrSelection(ev);
  endDeliveryAgencyLogoCropPan(ev);

});

  if(D.faqs.some(f=>f.category===newCategory)){
    await adminAlert('이미 같은 이름의 FAQ 탭이 있습니다.');

  }

    const res=await fetch('/api/admin/faqs/category',{method:'PATCH',headers:adminAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({oldCategory,newCategory})});

function setAnnouncementImagePreview(file=null,url=''){

  fileInput.addEventListener('change',()=>{const file=fileInput.files?.[0];if(file)setAnnouncementImagePreview(file);});

    const file=Array.from(event.clipboardData?.items||[]).find(item=>item.type.startsWith('image/'))?.getAsFile();

  const q=String(talkFilters.q||'').toLowerCase();

  return (D.talkPosts||[]).filter(post=>{
    if(status==='REPORTS'&&talkPendingReportCount(post)<=0)return false;
    if(status&&status!=='ALL'&&status!=='REPORTS'&&String(post.status||'').toUpperCase()!==status)return false;
    if(!q)return true;
    return String(talkAuthorId(post)||'').toLowerCase().includes(q)
      ||String(post.franchiseName||'').toLowerCase().includes(q)
      ||String(post.title||'').toLowerCase().includes(q)
      ||String(post.body||'').toLowerCase().includes(q);
  });
}
