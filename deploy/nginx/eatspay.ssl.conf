server {
    listen 80 default_server;
    server_name _ eatspay.kr www.eatspay.kr eatspay.co.kr www.eatspay.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name eatspay.kr www.eatspay.kr;

    ssl_certificate /etc/letsencrypt/live/eatspay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatspay.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name eatspay.co.kr www.eatspay.co.kr;

    ssl_certificate /etc/letsencrypt/live/eatspay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatspay.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/eatspay-home/site;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 404;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
